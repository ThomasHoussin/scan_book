* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { padding: 16px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
h1 { font-size: 18px; margin: 0 0 12px; }
.summary { overflow-x: auto; }
table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { padding: 4px 10px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
thead th { color: var(--muted); font-weight: 500; font-size: 12px; }
.layout { display: grid; grid-template-columns: 260px 1fr; min-height: calc(100vh - 160px); }
nav { border-right: 1px solid var(--line); padding: 12px; overflow-y: auto; max-height: calc(100vh - 20px); position: sticky; top: 0; background: var(--panel); }
nav h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 0 6px; }
nav a { display: flex; justify-content: space-between; gap: 6px; padding: 5px 8px; border-radius: 6px; color: inherit; text-decoration: none; font-size: 13px; }
nav a:hover { background: var(--bg); }
nav a.active { background: var(--accent); color: var(--panel); }
nav a .chips { display: flex; gap: 3px; }
.chip { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-top: 5px; }
main { padding: 16px 20px; min-width: 0; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.toolbar h2 { font-size: 16px; margin: 0 12px 0 0; }
button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
button[aria-pressed="true"] { background: var(--accent); color: var(--panel); border-color: var(--accent); }
.grid { display: grid; grid-template-columns: minmax(260px, 1fr) repeat(var(--n, 3), minmax(0, 1fr)); gap: 12px; align-items: start; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; min-width: 0; }
.card h3 { font-size: 13px; margin: 0 0 6px; display: flex; justify-content: space-between; gap: 8px; }
.metrics { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.image-card img { width: 100%; display: block; border-radius: 4px; cursor: zoom-in; }
.text { white-space: pre-wrap; font: 12.5px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace; max-height: 75vh; overflow: auto; margin: 0; overflow-wrap: anywhere; }
.diff del { background: var(--del-bg); color: var(--del-ink); text-decoration: line-through; }
.diff ins { background: var(--ins-bg); color: var(--ins-ink); text-decoration: none; }
.tests { list-style: none; padding: 0; margin: 0 0 8px; font-size: 12px; max-height: 30vh; overflow: auto; }
.tests li { padding: 2px 0; border-bottom: 1px dashed var(--line); }
.ok { color: var(--good); } .ko { color: var(--bad); }
.legend { font-size: 12px; color: var(--muted); }
.ref-card { margin-top: 12px; }
.furniture { font-size: 12px; color: var(--muted); }
@media (max-width: 1100px) { .grid { grid-template-columns: 1fr 1fr; } }
@media (max-width: 720px) {
  .layout { grid-template-columns: 1fr; }
  nav { position: static; max-height: none; border-right: 0; border-bottom: 1px solid var(--line); }
  .grid { grid-template-columns: 1fr; }
  header, main { padding: 12px 16px; }
}
</style>

dit à quiconque de franchir le pont. Il se plaça devant l'extrémité du pont et, apercevant une couleuvre sur le bord de la rivière, la captura et la jeta sur le pont en criant: \"Tiens, voilà pour toi grand Malin, voilà ta première personne, prends son âme\".\n\nLe Diable se trouva floué et entra dans une colère noire. Il dut s'exécuter mais il se vengea en rendant fou tous les serpents lors des pleines lunes.\n\nLes Veilleurs aiment à raconter cette légende dans laquelle un humain trompe le Diable. En revanche, ils ne souhaitent pas réveiller la colère du Malin et jettent une fois par mois une couleuvre sur le pont afin que le Diable ne vienne pas dérober une âme humaine.\n\n## La légende des fées aux doigts de glace\n\nCette légende concerne la fontaine aux fées. La légende raconte qu'il a y très longtemps de cela, avant le temps des hommes en manteau blanc marqués de la croix rouge, la fontaine coulait joyeusement, car elle était la résidence magique de dix fées sœurs, chargées de protéger l'eau du village.\n\nLes habitants en connaissaient l'existence et leur sacrifiaient des pièces et des petites offrandes. Mais, lorsque les chevaliers aux manteaux blancs arrivèrent dans le village, ils changèrent les choses.\n\nCes hommes étaient de haut lignage, bien fait de leur personne, fiers, courageux et savants en l'Art Royal. Ils engagèrent une cour d'amor à la belle manière des trouvères, avec les dix fées de la fontaine. Ils réussirent\n\nà capturer le cœur des dix fées plutôt habituées aux gentillesses un peu frustres des premiers habitants du village. Mais, au moment de terminer leur cour d'amor, les chevaliers durent partir sur l'ordre de leur grand maître, pour combattre l'infidèle en Terre Sainte. Avant de partir, les chevaliers jurèrent fidélité à leurs dames magiques.\n\nDe longs mois s'écoulèrent avant le retour des preux, durant lesquels les jolies fées se languirent. Lorsque les chevaliers, doublement croisés, revinrent de l'Orient, les fées connurent une grande déception. En effet, les chevaliers ramenèrent avec eux des belles princesses à la peau soyeuse et aux yeux d'amande. Ils ignorèrent les appels des fées.\n\nCelles-ci devinrent très jalouses des femmes orientales. Elles se firent alors pousser des doigts de glace et attrapèrent le cœur des mauresques venues laver leurs voiles de soie dans la fontaine.\n\nLes pauvres créatures, habituées au chaud soleil du désert, prirent froid et moururent toutes dans l'année, glacée comme la neige. Les chevaliers se vengèrent en condamnant les fées à garder perpétuellement ces doigts de glace et à les utiliser sur tout être cherchant à utiliser la fontaine.\n\nC'est ainsi que, peu à peu, les villageois abandonnèrent la petite fontaine, ses offrandes et ses rites. Les fées connaissent depuis une solitude glacée.\n\nLes Veilleurs perpétuent cette légende en jetant une fois par mois des glaçons taillés par le charpentier du village en forme de cœur dans la fontaine. Ils espèrent ainsi calmer le courroux des dix fées de la fontaine.\n", "status": "ok", "seconds": 19.0, "cer": 0.0006572461386789353, "wer": 0.004, "accent_edits": 0, "inserted_words": 0, "deleted_words": 0, "omitted_blocks": 0, "diff": "pour en examiner la beauté. L&#x27;architecte interdit à quiconque de franchir le pont. Il se plaça devant l&#x27;extrémité du pont et, apercevant une couleuvre sur le bord de la rivière, la captura et la jeta sur le pont en criant:&quot;Tiens, voilà pour toi grand Malin, voilà ta première personne, prends son âme&quot;. Le Diable se trouva floué et entra dans une colère noire. Il dut s&#x27;exécuter mais il se vengea en rendant fou tous les serpents lors des pleines lunes. Les Veilleurs aiment à raconter cette légende dans laquelle un humain trompe le Diable. En revanche, ils ne souhaitent pas réveiller la colère du Malin et jettent une fois par mois une couleuvre sur le pont afin que le Diable ne vienne pas dérober une âme humaine. La légende des fées aux doigts de glace Cette lége har-\ngées de protéger l'eau du village.\n\nLes habitants en connaissaient l'existence et\nleur sacrifiaient des pièces et des petites\noffrandes. Mais, lorsque les chevaliers aux\nmanteaux blancs arrivèrent dans le village,\nils changèrent les choses.\n\nCes hommes étaient de haut lignage, bien\nfait de leur personne, fiers, courageux et\nsavants en l'Art Royal. Ils engagèrent une\ncour d'amor à la belle manière des trouvères,\navec les dix fées de la fontaine. Ils réussirent\n\nà capturer le cœur des dix fées plutôt habi-\ntuées aux gentillesses un peu frustres des\npremiers habitants du village. Mais, au\nmoment de terminer leur cour d'amor, les\nchevaliers durent partir sur l'ordre de leur\ngrand maître, pour combattre l'infidèle en\nTerre Sainte. Avant de partir, les chevaliers\njurèrent fidélité à leurs dames magiques.\n\nDe longs mois s'écoulèrent avant le retour\ndes preux, durant lesquels les jolies fées se\nlanguirent. Lorsque les chevaliers, double-\nment croisés, revinrent de l'Orient, les fées\nconnurent une grande déception. En effet,\nles chevaliers ramenèrent avec eux des belles\nprincesses à la peau soyeuse et aux yeux\nd'amande. Ils ignorèrent les appels des fées.\n\nCelles-ci devinrent très jalouses des femmes\norientales. Elles se firent alors pousser des\ndoigts de glace et attrapèrent le cœur des\nmauresques venues laver leurs voiles de soie\ndans la fontaines.\n\nLes pauvres créatures, habituées au chaud\nsoleil du désert, prirent froid et moururent\ntoutes dans l'année, glacée comme la neige.\nLes chevaliers se vengèrent en condamnant\nles fées à garder perpétuellement ces doigts\nde glace et à les utiliser sur tout être cher-\nchant à utiliser la fontaine.\n\nC'est ainsi que, peu à peu, les villageois\nabandonnèrent la petite fontaine, ses\noffrandes et ses rites. Les fées connaissent\ndepuis une solitude glacée.\n\nLes Veilleurs perpétuent cette légende en\njetant une fois par mois des glaçons taillés\npar le charpentier du village en forme de\ncœur dans la fontaine. Ils espèrent ainsi cal-\nmer le courroux des dix fées de la fontaine.\n\n46\n", "status": "ok", "seconds": 37.26, "cer": 0.0052579691094314825, "wer": 0.008, "accent_edits": 0, "inserted_words": 4, "deleted_words": 0, "omitted_blocks": 0, "diff": "<ins>L ES V EILLEURS<\/ins> pour en examiner la beauté. L&#x27;architecte interdit à quiconque de franchir le pont. Il se plaça devant l&#x27;extrémité du pont et, apercevant une couleuvre sur le bord de la rivière, la captura et la jeta sur le pont en criant:&quot;Tiens, voilà pour toi grand Malin, voilà ta première personne, prends son âme&quot;. Le Diable se trouva floué et entra dans une colère noire. Il dut s&#x27;exécuter mais il se vengea en rendant fou tous les serpents lors des pleines lunes. Les Veilleurs aiment à raconter cette légende dans laquelle un humain trompe le Diable. En revanche, ils ne souhaitent pas réveiller la colère du Malin et jettent une fois par mois une couleuvre sur le pont afin que le Diable ne vienne pas dérober une âme humaine. La légende des fées aux doigts de glace Cette légende concerne la fontaine aux fées. La légende raconte qu&#x27;il a y très longtemps de cela, avant le temps des hommes en manteau blanc marqués de la croix rouge, la fontaine coulait joyeuseument, car elle était la résidence magique de dix fées soeurs, chargées de protéger l&#x27;eau du village. Les habitants en connaissaient l&#x27;existence et leur sacrifiaient des pièces et des petites offrandes. Mais, lorsque les chevaliers aux manteaux blancs arrivèrent dans le village, ils changèrent les choses. Ces hommes étaient de haut lignage, bien fait de leur personne, fiers, courageux et savants en l&#x27;Art Royal. Ils engagèrent une cour d&#x27;amor à la belle manière des trouvères, avec les dix fées de la fontaine. Ils réussirent à capturer le coeur des dix fées plutôt habituées aux gentillesses un peu frustres des premiers habitants du village. Mais, au moment de terminer leur cour d&#x27;  la tête.\n\nPour les calmer, il leur faut du sang, et en particulier du sang humain. Ils se mettent alors en meute et chassent les victimes innocentes. Lorsque vient à manquer une bête dans un troupeau, les paysans mi-effrayés, mi-riants mettent en cause la meute serpentine.\n\nLes conteurs des Veilleurs connaissent bien-entendu ce conte. Ils le gardent vivant en organisant des sacrifices lors des pleines lunes. Tous les 28 jours, deux Veilleurs se mettent en marche en direction du tumulus et de sa croix. Ils transportent avec eux une gourde en bois précieux, patinée par les nombreuses mains qui l'ont manipulée.\n\nLa gourde contient du sang humain que les Veilleurs collectent sur leurs personnes. Ce sang humain est censé calmer la fureur des serpents magiques et aussi les garder en vie.\n\nLes quantités de sang utilisées par les Veilleurs sont minimes mais les Nephilim peuvent en trouver des traces en cherchant bien autour du tumulus. Elles sont très difficiles à trouver surtout après une forte pluie.\n\n## La légende de l'Ermite\n\nCette légende raconte que l'Ermite serait le premier Veilleur qui vivrait éternellement dans le cœur de la forêt et ce depuis la création des Veilleurs, après la fuite des Templiers. L'Ermite vivrait en communion avec la Terre se nourissant de ses produits. Il parlerait avec les bêtes, chanterait avec les oiseaux et ne ferait de mal à aucune mouche. En revanche, son grand âge et la misère noire dans laquelle il vit l'ont rendu un peu fou. Il paraitraît ainsi qu'il est capable de voir les esprits magiques qui hantent la forêt, les lieux maudits du village et certains humains. Il pourrait parler avec les esprits magiques de l'eau, de la terre, du feu, de l'air et même avec ceux de la lune. Très peu de personnes l'ont véritablement vu. Seuls certains chasseurs disent avoir croisé une silhouette famélique dans les bois.\n\nLes Veilleurs connaissent l'identité exacte de l'Ermite. Il est le chef des Veilleurs, le grand conteur qui, devenu trop vieux pour assurer ses fonctions, fait semblant de mourir. Il est alors enterré dans le cimetière dans une tombe spéciale. Cette tombe communique avec les souterrains du village.\n\nL'ancien chef s'échappe par ceux-ci et, les connaissant très bien, prend celui qui mène à la forêt. Il remonte à la surface et devient le nouvel Ermite. Il médite alors sur les légendes du village et, quelquefois, un jeune Veilleur préparant sa première Veillée est envoyé à sa rencontre afin de demander des conseils sur la manière de raconter les contes et les légendes.\n\nCette connaissance est l'un des secrets les mieux gardés des Veilleurs. En général, seuls le grand conteur et ses aides les plus proches la connaissent.\n", "status": "ok", "seconds": 19.42, "cer": 0.0, "wer": 0.0, "accent_edits": 0, "inserted_words": 0, "deleted_words": 0, "omitted_blocks": 0, "diff": "Les légendes au sujet de la croix La croix aux serpents ou au tumulus selon les uns ou les autres est un lieu idéal pour les légendes. Plusieurs récits courent sur cet endroit mystérieux. La première raconte que durant certaines nuits de pleine lune, une quantité incroyable de serpents se rassemblent autour de la croix afin de l&#x27;adorer. Les serpents alors deviennent hystériques, crachent leur venin sur la croix, se tordant en tous sens, remuant frénétiquement la tête. Pour les calmer, il leur faut du sang, et en particulier du sang humain. Ils se mettent alors en meute et chassent les victimes innocentes. Lorsque vient à manquer une bête dans un troupeau, les paysans mieffrayés, miriants mettent en cause la meute serpentine. Les conteurs des Veilleurs connaissent bienentendu ce conte. Ils le gardent vivant en organisant des sacrifices lors des pleines lunes. Tous les 28 jours, deux Veilleurs se mettent en marche en direction du tumulus et de sa croix. Ils transportent avec eux une gourde en bois précieux, patinée par les nombreuses mains qui l&#x27;ont manipulée. La gourde contient du sang humain que les Veilleu itive le\nNexus et le transforme en un anti-Nexus (un\nNexus qui absorbe l’énergie magique au lieu\nde la rayonner).\n\nMais ceci n’empêche pas le Khaïba d’agoni-\nser et de mourir si les Nephilim ne font rien.\nDétruire les toiles après la création de l’anti-\nNexus tue le Pulsarium définitivement et par\nune opération magique très puissante l’anti-\nNexus devient une boule extrêmement\ninstable d’Orichalque.\n\nPrise c: la défaite du Pulsarium\nLes Nephilim ou bien les autres personnages\ndu scénario comme les Veilleurs ou Jacques\nCrux empêchent Raoul Dubreuil/Le Pulsarium\nde terminer ses toiles. Cela arrête le proces-\nsus de formation du Nexus et fait tomber à\nnouveau dans l’inaction les Plexus qui com-\nmençaient à s’éveiller. Si Le Pulsarium est\nencore en état de faire quelque chose, il\ncherchera à se venger des fautifs. Les\nNephilim perdent l’occasion de mettre la\nmain sur un Nexus permanent.\n\nEpilogue\n\nLa fin de ce scénario est ouverte comme le\nreste du supplément. Il est intéressant de\njouer les interactions entre les Nephilim, les\nseconds rôles et les légendes du village qui\nprennent corps.\n\nRien ne vous empêche de faire votre propre\nscénario à l’intérieur des Veilleurs, de créer\nvotre propre histoire. L’idéal est d’utiliser\nrégulièrement le village comme base d’aven-\ntures pour les Nephilim ou pour différents\ngroupes.\n\nLes Nephilim qui réussissent le scénario sont\nceux qui arrivent à conserver pour eux l’utili-\nsation du Nexus. L’idéal est qu’ils y installent\nune sorte de base.\n\nCela permet ensuite au Maître de Jeu d’utili-\nser le village comme base d’aventures\ndiverses et en particulier de lier ce premier\nsupplément avec le deuxième de la gamme\nNephilim: l’Ordre du Bâton.\n\nEn effet, l’Ordre du Bâton détaille les\nTempliers et une grande partie de leur obé-\ndience. Or le village est une ancienne com-\nmanderie templière. L’obédience de Laurent\nGrilpin peut donc organiser une opération de\ngrande envergure afin de reprendre les lieux\naux Nephilim.\n", "furniture": ["Les Veilleurs", "66"]}, {"id": "lion-vert-0007", "set": "scans", "group": "Le Lion Vert", "image": "../inputs/images/lion-vert-0007.llm.png", "full_image": "../inputs/images/lion-vert-0007.png", "engines": {"marker2": {"raw": "la rue. Une sorte de grand lion à la crinière touffue et fournie est assis sur le sol. Sa queue passe entre les pattes remonte jusque derrière le dos. Le lion ne semble pas animé de mauvaises intentions pourtant il tient dans la gueule grande ouverte un soleil dit \"baroque\". Ce soleil possède un visage aux traits graves et vingt-deux rayons formés comme des pétales. Il repose délicatement sur une tige, elle même posée sur le sol par trois racines apparentes. En regardant bien le calicot, on peut remarquer des longues gouttes de sang coulant de la gueule du lion et le long de la tige. Telle est l'enseigne de la librairie \"l'incunable souveraineté\".\n\nCe nom mystérieux, peint sur une planche de bois, accueille le curieux qui pousse la porte d'entrée, fait résonner le grelot d'or et découvre les habitués de la librairie.\n\n## les résidents\n\nLa librairie abrite une véritable petite tribu entièrement dévouée à son fonctionnement. Ces individus sont tous plus ou moins contaminés par les attributs ésotériques de la librairie.\n\n### Le docteur Parangon\n\nIl est le propriétaire de la librairie. Le docteur Parangon (connu que sous cette appellation) est un vieux bonhomme bougon, légérement vouté. Il porte une barbe poivre et sel relativement longue. Son visage aux traits fins semble mélanger les traits de plusieurs individus. En effet, lorsqu'on le regarde, il change toujours d'apparence. Chaque fois l'on peut remarquer un nouveau détail typant son visage ou la disparition d'un ancien repaire. Il affectionne le port du bonnet de lecture avec un pompon doré ainsi que le gilet par dessus une chemise aux manches longues. Il porte des pantalons de velours élimés mais toujours très bien repassés et des mocassins de cuir. Au premier abord, il parait comme malpoli. Il ne serre pas la main, maugrée bonjours et s'en va derrière son bureau ranger quelques papiers. Si l'on interroge, il répond de manière évasive. Il commence à s'intéresser à ses interlocuteurs que lorsqu'ils font des allusions sérieuses à\n\nl'occultisme. Là, son oeil s'allume, son esprit se déploie et une conversation réelle peut s'engager. Il se met alors à faire des allusions très poussées sur certains secrets occultes. Ses thèmes de prédilection sont l'Agartha, l'Akhasha et le Saint-Graal. Il s'amuse souvent aussi à faire croire aux clients qu'il détient des secrets et qu'il est lui même un initié. Il ne veut pas avouer clairement qu'il connait certains secrets des Nephilim.\n\nCe mystérieux personnage possède une histoire compliquée dont seules certaines parties sont dévoilées ici. A l'origine, le docteur Parangon était un libre-penseur suivant les principes de Pythagore et vivant durant l'Empire Romain. Pour des raisons obscures, il se mit au service du Lion Vert. Celui-ci passa un pacte avec le docteur Parangon. Il lui permit d'avoir la vie éternelle et lui demanda en échange de toujours obéir à ses ordres quelqu'en soit la teneur. Le premier d'entre eux fut de monter une bibliothèque-librairie qui devait perdurer tout au long des temps.\n\nLorsque le docteur Parangon voit venir la mort, il choisit un corps d'un individu dont il apprécie les connaissances occultes puis au cours d'une cérémonie fait plonger son Kasoleil dans une fiole magique fabriquée par le Lion Vert. Le corps choisit boit alors la fiole et la personnalité de l'ancien docteur Parangon renait. Ainsi, le docteur Parangon peut être vu comme une créature semi-magique qui contient en elle les 22 personnalités ressemblantes des anciens docteurs. Il peut quand il le veut (mais cela lui demande un effort considérable) faire appel à ses anciennes personnalités. Cette renaissance va même jusqu'à modifier l'apparence du nouveau corps pour la faire ressembler au docteur Parangon originel. Mais l'intellect du corps garde une certaine vie et il arrive que des conflits se produisent entre les différents docteurs Parangon. Alors, le vieux libraire se mettra à marmonner en latin ou en vieux français, il est certain qu'il en sait plus qu'il veut bien en montrer. A vous d'agacer vos Nephilim avec ces secrets.\n\n### Guillard Gaillard\n\nCe résident est l'aide simplet et fidèle du docteur Parangon. Il est très grand, bedonnant. Des cheveux filasses lui couvrent une partie du front. Ses yeux expriment plus l'animal que l'intelligence humaine. C'est\n\n# L'Incunable Souveraineté\n", "status": "ok", "seconds": 28.91, "cer": 0.0011668611435239206, "wer": 0.0072254335260115606, "accent_edits": 0, "inserted_words": 0, "deleted_words": 0, "omitted_blocks": 0, "diff": "la rue. Une sorte de grand lion à la crinière touffue et fournie est assis sur le sol. Sa queue passe entre les pattes remonte jusque derrière le dos. Le lion ne semble pas animé de mauvaises intentions pourtant il tient dans la gueule grande ouverte un soleil dit&quot;baroque&quot;. Ce soleil possède un visage aux traits graves et vingtdeux rayons formés comme des pétales. Il repose délicatement sur une tige, elle même posée sur le sol par trois racines apparentes. En regardant bien le calicot, on peut remarquer des longues gouttes de sang coulant de la gueule du lion et le long de la tige. <del>telle<\/del> <ins>Telle<\/ins> est l&#x27;enseigne de la librairie&quot;l&#x27;incunable souveraineté&quot;. Ce nom mystérieux, peint sur une planche de bois, accueille le curieux qui pousse la porte d&#x27;entrée, fait résonner le grelot d&#x27;or et découvre les habitués de la librairie. les résidents La librairie abrite une véritable petite tribu entièrement dévouée à son fonctionnement. Ces individus sont tous plus ou moins contaminés par les attributs ésotériques de la librairie. Le docteur Parangon Il est le propriétaire de la librairie. Le docteur Pa r l&#x27;apparence du nouveau corps pour la faire ressembler au docteur Parangon originel. Mais l&#x27;intellect du corps garde une certaine vie et il arrive que des conflits se produisent entre les différents docteurs Parangon. Alors, le vieux libraire se mettra à marmonner en latin ou en vieux <del>français.<\/del> <ins>français,<\/ins> il est certain qu&#x27;il en sait plus qu&#x27;il veut bien en montrer. A vous d&#x27;agacer vos Nephilim avec ces secrets. Guillard Gaillard Ce résident est l&#x27;aide simplet et fidèle du docteur Parangon. Il est très grand, bedonnant. Des cheveux filasses lui couvrent une partie du front. Ses yeux expriment plus l&#x27;animal que l&#x27;intelligence humaine. C&#x27;est"}, "haiku": {"raw": "la rue. Une sorte de grand lion à la crinière\ntouffue et fournie est assis sur le sol. Sa\nqueue passe entre les pattes remonte jusque\nderrière le dos. Le lion ne semble pas animé\nde mauvaises intentions pourtant il tient\ndans la gueule grande ouverte un soleil dit\n\"baroque\". Ce soleil possède un visage aux\ntraits graves et vingt-deux rayons formés\ncomme des pétales. Il repose délicatement\nsur une tige, elle même posée sur le sol par\ntrois racines apparentes. En regardant bien le\ncalicot, on peut remarquer des longues\ngouttes de sang coulant de la gueule du lion\net le long de la tige. telle est l'enseigne de la\nlibrairie \"l'incunable souveraineté\".\n\nCe nom mystérieux, peint sur une planche de\nbois, accueille le curieux qui pousse la porte\nd'entrée, fait résonner le grelot d'or et\ndécouvre les habitués de la librairie.\n\nles résidents\n\nLa librairie abrite une véritable petite tribu\nentièrement dévouée à son fonctionnement.\nCes individus sont tous plus ou moins conta-\nminés par les attributs ésotériques de la\nlibrairie.\n\nLe docteur Parangon\n\nIl est le propriétaire de la librairie. Le docteur\nParangon (connu que sous cette appellation)\nest un vieux bonhomme bougon, légèrement\nvoûté. Il porte une barbe poivre et sel relati-\nvement longue. Son visage aux traits fins\nsemble mélanger les traits de plusieurs indi-\nvidus. En effet, lorsqu'on le regarde, il chan-\nge toujours d'apparence. Chaque fois l'on\npeut remarquer un nouveau détail typant\nson visage ou la disparition d'un ancien\nrepaire. Il affectionne le port du bonnet de\nlecture avec un pompon doré ainsi que le\ngilet par dessus une chemise aux manches\nlongues. Il porte des pantalons de velours\nélimés mais toujours très bien repassés et des\nmocassins de cuir. Au premier abord, il\nparait comme malpoli. Il ne serre pas la\nmain, maugrée bonjours et s'en va derrière\nson bureau ranger quelques papiers. Si l'on\ninterroge, il répond de manière évasive. Il\ncommence à s'intéresser à ses interlocuteurs\nque lorsqu'ils font des allusions sérieuses à\n\nl'occultisme. Là, son oeil s'allume, son esprit\nse déploie et une conversation réelle peut\ns'engager. il se met alors à faire des allusions\ntrès poussées sur certains secrets occultes.\nSes thèmes de prédilection sont l'Agartha,\nl'Akhasha et le Saint-Graal. Il s'amuse sou-\nvent aussi à faire croire aux clients qu'il\ndétient des secrets et qu'il est lui même un\ninitié. il ne veut pas avouer clairement qu'il\nconnait certains secrets des Nephilim.\n\nCe mystérieux personnage possède une his-\ntoire compliquée dont seules certaines par-\nties sont dévoilées ici. A l'origine, le docteur\nParangon était un libre-penseur suivant les\nprincipes de Pythagore et vivant durant\nl'Empire Romain. Pour des raisons obscures,\nil se mit au service du Lion Vert. Celui-ci pas-\nsa un pacte avec le docteur Parangon. Il lui\npermit d'avoir la vie éternelle et lui demanda\nen échange de toujours obéir à ses ordres\nquelqu'en soit la teneur. Le premier d'entre\neux fut de monter une bibliothèque-librairie\nqui devait perdurer tout au long des temps.\n\nLorsque le docteur Parangon voit venir la\nmort. il choisit un corps d'un individu dont il\napprécie les connaissances occultes puis au\ncours d'une cérémonie fait plonger son Ka-\nsoleil dans une fiole magique fabriquée par\nle Lion Vert. Le corps choisi boit alors la fiole\net la personnalité de l'ancien docteur Paran-\ngon renait. Ainsi, le docteur Parangon peut\nêtre vu comme une créature semi-magique\nqui contient en elle les 22 personnalités res-\nsemblantes des anciens docteurs. Il peut\nquand il le veut (mais cela lui demande un\neffort considérable) faire appel à ses\nanciennes personnalités. Cette renaissance va\nmême jusqu'à modifier l'apparence du nou-\nveau corps pour la faire ressembler au doc-\nteur Parangon originel. Mais l'intellect du\ncorps garde une certaine vie et il arrive que\ndes conflits se produisent entre les différents\ndocteurs Parangon. Alors, le vieux libraire se\nmettra à marmonner en latin ou en vieux\nfrançais. il est certain qu'il en sait plus qu'il\nveut bien en montrer. A vous d'agacer vos\nNephilim avec ces secrets.\n\nGuillard Gaillard\n\nCe résident est l'aide simplet et fidèle du\ndocteur Parangon. Il est très grand, bedon-\nnant. Des cheveux filasses lui couvrent une\npartie du front. Ses yeux expriment plus\nl'animal que l'intelligence humaine. C'est\n\n5\n", "status": "ok", "seconds": 47.99, "cer": 0.0007001166861143524, "wer": 0.004335260115606936, "accent_edits": 2, "inserted_words": 0, "deleted_words": 0, "omitted_blocks": 0, "diff": "la rue. Une sorte de grand lion à la crinière touffue et fournie est assis sur le sol. Sa queue passe entre les pattes remonte jusque derrière le dos. Le lion ne semble pas animé de mauvaises intentions pourtant il tient dans la gueule grande ouverte un soleil dit&quot;baroque&quot;. Ce soleil possède un visage aux traits graves et vingtdeux rayons formés comme des pétales. Il repose délicatement sur une tige, elle même posée sur le sol par trois racines apparentes. En regardant bien le calicot, on peut remarquer des longues gouttes de sang coulant de la gueule du lion et le long de la tige. telle est l&#x27;enseigne airie “l’incunable souveraineté”.\n\nCe nom mystérieux, peint sur une planche de\nbois, accueille le curieux qui pousse la porte\nd’entrée, fait résonner le grelot d’or et\ndécouvre les habitués de la librairie.\n\nles résidents\n\nLa librairie abrite une véritable petite tribu\nentièrement dévouée à son fonctionnement.\nCes individus sont tous plus ou moins conta-\nminés par les attributs ésotériques de la\nlibrairie.\n\nLe docteur Parangon\n\nIl est le propriétaire de la librairie. Le docteur\nParangon (connu que sous cette appellation)\nest un vieux bonhomme bougon, légérement\nvouté. Il porte une barbe poivre et sel relati-\nvement longue. Son visage aux traits fins\nsemble mélanger les traits de plusieurs indi-\nvidus. En effet, lorsqu’on le regarde, il chan-\nge toujours d’apparence. Chaque fois l’on\npeut remarquer un nouveau détail typant\nson visage ou la disparition d’un ancien\nrepaire. Il affectionne le port du bonnet de\nlecture avec un pompon doré ainsi que le\ngilet par dessus une chemise aux manches\nlongues. Il porte des pantalons de velours\nélimés mais toujours très bien repassés et des\nmocassins de cuir. Au premier abord, il\nparait comme malpoli. Il ne serre pas la\nmain, maugrée bonjours et s’en va derrière\nson bureau ranger quelques papiers. Si l’on\ninterroge, il répond de manière évasive. Il\ncommence à s’intéresser à ses interlocuteurs\nque lorsqu’ils font des allusions sérieuses à\nl’occultisme. Là, son oeil s’allume, son esprit\nse déploie et une conversation réelle peut\ns’engager. il se met alors à faire des allusions\ntrès poussées sur certains secrets occultes.\nSes thèmes de prédilection sont l’Agartha,\nl’Akhasha et le Saint-Graal. Il s’amuse sou-\nvent aussi à faire croire aux clients qu’il\ndétient des secrets et qu’il est lui même un\ninitié. il ne veut pas avouer clairement qu’il\nconnait certains secrets des Nephilim.\n\nCe mystérieux personnage possède une his-\ntoire compliquée dont seules certaines par-\nties sont dévoilées ici. A l’origine, le docteur\nParangon était un libre-penseur suivant les\nprincipes de Pythagore et vivant durant\nl’Empire Romain. Pour des raisons obscures,\nil se mit au service du Lion Vert. Celui-ci pas-\nsa un pacte avec le docteur Parangon. Il lui\npermit d’avoir la vie éternelle et lui demanda\nen échange de toujours obéir à ses ordres\nquelqu’en soit la teneur. Le premier d’entre\neux fut de monter une bibliothèque-librairie\nqui devait perdurer tout au long des temps.\n\nLorsque le docteur Parangon voit venir la\nmort. il choisit un corps d’un individu dont il\napprécie les connaissances occultes puis au\ncours d’une cérémonie fait plonger son Ka-\nsoleil dans une fiole magique fabriquée par\nle Lion Vert. Le corps choisit boit alors la fiole\net la personnalité de l’ancien docteur Paran-\ngon renait. Ainsi, le docteur Parangon peut\nêtre vu comme une créature semi-magique\nqui contient en elle les 22 personnalités res-\nsemblantes des anciens docteurs. Il peut\nquand il le veut (mais cela lui demande un\neffort considérable) faire appel à ses\nanciennes personnalités. Cette renaissance va\nmême jusqu’à modifier l’apparence du nou-\nveau corps pour la faire ressembler au doc-\nteur Parangon originel. Mais l’intellect du\ncorps garde une certaine vie et il arrive que\ndes conflits se produisent entre les différents\ndocteurs Parangon. Alors, le vieux libraire se\nmettra à marmonner en latin ou en vieux\nfrançais. il est certain qu’il en sait plus qu’il\nveut bien en montrer. A vous d’agacer vos\nNephilim avec ces secrets.\n\nGuillard Gaillard\n\nCe résident est l’aide simplet et fidèle du\ndocteur Parangon. Il est très grand, bedon-\nnant. Des cheveux filasses lui couvrent une\npartie du front. Ses yeux expriment plus\nl’animal que l’intelligence humaine. C’est\n", "furniture": ["L’Incunable Souveraineté", "5"]}, {"id": "lion-vert-0008", "set": "scans", "group": "Le Lion Vert", "image": "../inputs/images/lion-vert-0008.llm.png", "full_image": "../inputs/images/lion-vert-0008.png", "engines": {"marker2": {"raw": "# L'Incumable Souveraineté\n\nune vraie force de la nature et attaquera tel un berseker toutes les personnes qui veulent du mal à son maître. Il n'empêche qu'il est le seul à se reconnaître dans l'absence de classement de la librairie.\n\nGuillard Gaillard est le résultat d'une cérémonie ratée de transfert de Ka-soleil du docteur Parangon. L'acte magique a rendu abruti le corps-receptacle mais a développé dans l'esprit abimé de l'humain consentant des facultés importantes concernant les classements. Cela est presque maladif chez Guillard. Il ne peut s'empêcher de tout classer et on peut le voir errer derrière les clients de la librairie afin de nettoyer et de remettre en ordre tous les objets qu'ils déplacent. Il est aussi un ancien notable de la ville de la librairie qui depuis cet accident est porté manquant par sa famille. L'expérience l'ayant transformé physiquement, on ne l'a pas encore reconnu. Mais peut-être un jour...\n\n## Fward\n\nFward est un nain bossu bon à tout faire de la maisonnée. Il fait le ménage, la cuisine ainsi que toutes les taches ménagères. Il ne parle pratiquement jamais. C'est aussi l'aide en alchimie du docteur Parangon. Il s'y connait beaucoup et pourra impressioner les Nephilim par sa science ésotérique.\n\n## Helena Goldstein\n\nHelena est la restauratrice et la relieuse des livres de la librairie. D'origine juive, elle a été recueillie, toute petite pendant la guerre sur les ordres du Lion Vert par le docteur Parangon lors des traques de la Milice. Elle ne connaît pas son père et ceci l'a rendue particulièrement mélancolique. Elle est aussi belle.\n\nElle cherche le secret de son père disparu durant la guerre. Grand Initié, il a été peut-être un Nephilim. Le docteur Parangon garde dans son laboratoire alchimiques les documents secrets d'Helena Goldstein. Ces documents contiennent des informations importantes sur le Lion Vert et sur ses interactions vis-à-vis des Nephilim normaux.\n\n## Les Initiés de l'incunable souveraineté\n\nLe docteur Parangon a réuni autours de lui une petite société initiatique dont il fait profiter des mystères de la librairie. Ces individus sont des \"amis\" du docteur.\n\nRégulièrement, ils assistent à des cérémonies occultes dans l'amphithéâtre de Mithragys durant lesquelles ils discutent de sujets passionnants sur la virtualité embryonnaire de la pierre philosophale rouge ou sur l'effet des poils d'un lycanthrope sur les cauchemars des Supérieurs Invisibles. Toutes les réunions se font à visage couvert par un masque vénistien en bronze. En général, le docteur Parangon demande à ses initiés de porter aussi une cape en velours vert (couleur de l'initiation magique) doublée de soie dorée (couleur de l'enseignement ésotérique).\n\nVéritable club ésotérique, le Cercle de l'Incunable Souveraineté permet à ses membres et surtout au docteur Parangon de garder une esprit ésotérique très actif et de se maintenir au courant des dernières recherches occultes dans la région. C'est aussi un moyen très subtil pour Parangon d'influencer et même de manipuler certains membres du Cercle. Ceux-ci sont liés par le libraire par un serment de mort concernant les secrets du cercle.\n\nIl est très difficile d'y rentrer mais un Nephilim particulièrement prudent pourra peut-être en faire partie. Il lui faudra d'abord apprivoiser le docteur et ensuite passer le test initiatique. Ce test consiste à lire un texte occulte suffisamment nouveau ou intriguer pour exciter l'intérêt des autres membres. Ce passeurs du fleuve Arcadio ont l'habitude de se réunir toutes les pleines lunes sous les arbres-fils de la connaissance. Ils partagent aussi certaines des élixirs de connaissance que fabrique le docteur avec son athanor.\n\nLe cercle possède pour l'instant douze membres en comptant le docteur et M. Natonin, l'occultiste averti. Ils se reconnaissent entre eux par le port d'une bague noire au chaton plat sur lequel est gravé en jade la figure stylisée du Lion Vert.\n", "status": "ok", "seconds": 24.58, "cer": 0.014568158168574402, "wer": 0.01800327332242226, "accent_edits": 0, "inserted_words": 5, "deleted_words": 0, "omitted_blocks": 0, "diff": "<ins>L&#x27;Incumable Souveraineté<\/ins> une vraie force de la nature et attaquera tel un berseker toutes les personnes qui veulent du mal à son maître. <del>il<\/del> <ins>Il<\/ins> n&#x27;empêche qu&#x27;il est le seul à se reconnaître dans l&#x27;absence de classement de la librairie. Guillard Gaillard est le résultat d&#x27;une cérémonie ratée de transfert de Kasoleil du <del>doctur<\/del> <ins>docteur<\/ins> Parangon. L&#x27;acte magique a rendu abruti le corpsreceptacle mais a développé dans l&#x27;esprit abimé de l&#x27;humain consentant des facultés importantes concernant les classements. Cela est presque maladif chez Guillard. Il ne peut s&#x27;empêcher de tout classer et on peut le voir errer derrière les clients de la librairie afin de nettoyer et de remettre en ordre tous les objets qu&#x27;ils <ins>déplacent.<\/ins> <del>déplacent.Il<\/del> <ins>Il<\/ins> est aussi un ancien notable de la ville de la librairie qui depuis cet accident est porté manquant par sa famille. L&#x27;expérience l&#x27;ayant transformé physiquement, on ne l&#x27;a pas encore reconnu. Mais peutêtre un jour... Fward Fward est un nain bossu bon à tout faire de la maisonnée. Il fait le ménage, la cuisine ainsi que toutes les taches ménagères. Il ne parle pratiquement jamais. C&#x27;est aussi l&#x27;aide en alchimie du docteur Parangon. Il s&#x27;y connait beaucoup et pourra impressioner les Nephilim par sa science ésotérique. Helena Goldstein Helena est la restauratrice et la relieuse des livres de la librairie. D&#x27;origine juive, elle a été recueillie, toute petite pendant la guerre sur les ordres du Lion Vert par le docteur Parangon lors des traques de la Milice. Elle ne connaît pas son père et ceci l&#x27;a rendue particulièrement mélancolique. Elle est aussi belle. Elle che ors des traques de la Milice. Elle ne connaît pas son père et ceci l'a rendue particulièrement mélancolique. Elle est aussi belle.\n\nElle cherche le secret de son père disparu durant la guerre. Grand Initié, il a été peut-être un Nephilim. Le docteur Parangon garde dans son laboratoire alchimiques les documents secrets d'Helena Goldstein. Ces documents contiennent des informations importantes sur le Lion Vert et sur ses interactions vis-à-vis des Nephilim normaux.\n\n## Les Initiés de l'incunable souveraineté\n\nLe docteur Parangon a réuni autours de lui une petite société initiatique dont il fait profiter des mystères de la librairie. Ces individus sont des \"amis\" du docteur.\n\nRégulièrement, ils assistent à des cérémonies occultes dans l'amphithéâtre de Mithragys durant lesquelles ils discutent de sujets passionnants sur la virtualité embryonnaire de la pierre philosophale rouge ou sur l'effet des poils d'un lycanthrope sur les cauchemars des Supérieurs Invisibles. Toutes les réunions se font à visage couvert par un masque vénistien en bronze. En général, le docteur Parangon demande à ses initiés de porter aussi une cape en velours vert (couleur de l'initiation magique) doublée de soie dorée (couleur de l'enseignement ésotérique).\n\nVéritable club ésotérique, le Cercle de l'Incunable Souveraineté permet à ses membres et surtout au docteur Parangon de garder une esprit ésotérique très actif et de se maintenir au courant des dernières recherches occultes dans la région. C'est aussi un moyen très subtil pour Parangon d'influencer et même de manipuler certains membres du Cercle. Ceux-ci sont liés par le libraire par un serment de mort concernant les secrets du cercle.\n\nIl est très difficile d'y rentrer mais un Nephilim particulièrement prudent pourra peut-être en faire partie. Il lui faudra d'abord apprivoiser le docteur et ensuite passer le test initiatique. Ce test consiste à lire un texte occulte suffisamment nouveau ou intriguer pour exciter l'intérêt des a r certains membres du Cercle. Ceuxci sont liés par le libraire par un serment de mort concernant les secrets du cercle. Il est très difficile d&#x27;y rentrer mais un Nephilim particulièrement prudent pourra peutêtre en faire partie. Il lui faudra d&#x27;abord apprivoiser le docteur et ensuite passer le test initiatique. Ce test consiste à lire un texte occulte suffisamment nouveau ou intriguer pour exciter l&#x27;intérêt des autres membres. <del>Ces<\/del> <ins>Ce<\/ins> passeurs du fleuve Arcadio ont l&#x27;habitude de se réunir toutes les pleines lunes sous les arbresfils de la connaissance. Ils partagent aussi certaines des élixirs de connaissance que fabrique le docteur avec son athanor. Le cercle possède pour l&#x27;instant douze membres en comptant le docteur et M. Natonin, l&#x27;occultiste averti. Ils se reconnaissent entre eux par le port d&#x27;une bague noire au chaton plat sur lequel est gravé en jade la figure stylisée du Lion Vert."}, "haiku": {"raw": "une vraie force de la nature et attaquera tel\nun berseker toutes les personnes qui veulent\ndu mal à son maître. il n'empêche qu'il est le\nseul à se reconnaître dans l'absence de clas-\nsement de la librairie.\n\nGuillard Gaillard est le résultat d'une céré-\nmonie ratée de transfert de Ka-soleil du doc-\ntur Parangon. L'acte magique a rendu abruti\nle corps-receptacle mais a développé dans\nl'esprit abimé de l'humain consentant des\nfacultés importantes concernant les classe-\nments. Cela est presque maladif chez\nGuillard. Il ne peut s'empêcher de tout clas-\nser et on peut le voir errer derrière les clients\nde la librairie afin de nettoyer et de remettre\nen ordre tous les objets qu'ils déplacent.Il est\naussi un ancien notable de la ville de la\nlibrairie qui depuis cet accident est porté\nmanquant par sa famille. L'expérience\nl'ayant transformé physiquement, on ne l'a\npas encore reconnu. Mais peut-être un jour...\n\nFward\n\nFward est un nain bossu bon à tout faire de\nla maisonnée. Il fait le ménage, la cuisine\nainsi que toutes les taches ménagères. Il ne\nparle pratiquement jamais. C'est aussi l'aide\nen alchimie du docteur Parangon. Il s'y\nconnait beaucoup et pourra impressioner les\nNephilim par sa science ésotérique.\n\nHelena Goldstein\n\nHelena est la restauratrice et la relieuse des\nlivres de la librairie. D'origine juive, elle a été\nrecueillie, toute petite pendant la guerre sur\nles ordres du Lion Vert par le docteur Paran-\ngon lors des traques de la Milice. Elle ne\nconnaît pas son père et ceci l'a rendue parti-\nculièrement mélancolique. Elle est aussi belle.\n\nElle cherche le secret de son père disparu\ndurant la guerre. Grand Initié, il a été peut-\nêtre un Nephilim. Le docteur Parangon garde\ndans son laboratoire alchimiques les docu-\nments secrets d'Helena Goldstein. Ces docu-\nments contiennent des informations impor-\ntantes sur le Lion Vert et sur ses interactions\nvis-à-vis des Nephilim normaux.\n\nLes Initiés de\nl'incunable souveraineté\n\nLe docteur Parangon a réuni autours de lui\nune petite société initiatique dont il fait pro-\nfiter des mystères de la librairie. Ces indivi-\ndus sont des \"amis\" du docteur.\n\nRégulièrement, ils assistent à des cérémonies\noccultes dans l'amphithéâtre de Mithragys\ndurant lesquelles ils discutent de sujets pas-\nsionnants sur la virtualité embryonnaire de la\npierre philosophale rouge ou sur l'effet des\npoils d'un lycanthrope sur les cauchemars\ndes Supérieurs Invisibles. Toutes les réunions\nse font à visage couvert par un masque véni-\ntien en bronze. En général, le docteur Paran-\ngon demande à ses initiés de porter aussi\nune cape en velours vert (couleur de l'initia-\ntion magique) doublée de soie dorée (cou-\nleur de l'enseignement ésotérique).\n\nVéritable club ésotérique, le Cercle de l'Incu-\nnable Souveraineté permet à ses membres et\nsurtout au docteur Parangon de garder un\nesprit ésotérique très actif et de se maintenir\nau courant des dernières recherches occultes\ndans la région. C'est aussi un moyen très sub-\ntil pour Parangon d'influencer et même de\nmanipuler certains membres du Cercle. Ceux-\nci sont liés par le libraire par un serment de\nmort concernant les secrets du cercle.\n\nIl est très difficile d'y rentrer mais un Nephi-\nlim particulièrement prudent pourra peut-\nêtre en faire partie. Il lui faudra d'abord\napprivoiser le docteur et ensuite passer le test\ninitiatique. Ce test consiste à lire un texte\nocculte suffisamment nouveau ou intrigue\npour exciter l'intérêt des autres membres. Ces\npasseurs du fleuve Arcadio ont l'habitude de\nse réunir toutes les pleines lunes sous les\narbres-fils de la connaissance. Ils partagent\naussi certaines des élixirs de connaissance\nque fabrique le docteur avec son athanor.\n\nLe cercle possède pour l'instant douze\nmembres en comptant le docteur et M. Nato-\nnin, l'occultiste averti. Ils se reconnaissent\nentre eux par le port d'une bague noire au\nchaton plat sur lequel est gravé en jade la\nfigure stylisée du Lion Vert.\n\n6\n", "status": "ok", "seconds": 47.2, "cer": 0.00026014568158168577, "wer": 0.0016366612111292963, "accent_edits": 0, "inserted_words": 0, "deleted_words": 0, "omitted_blocks": 0, "diff": "une vraie force de la nature et attaquera tel un berseker toutes les personnes qui veulent du mal à son maître. il n&#x27;empêche qu&#x27;il est le seul à se reconnaître dans l&#x27;absence de classement de la librairie. Guillard Gaillard est le résultat d&#x27;une cérémonie ratée de transfert de Kasoleil du doctur Parangon. L&#x27;acte magique a rendu abruti le corpsreceptacle mais a développé dans l&#x27;esprit abimé de l&#x27;humain consentant des facultés importantes concernant les classements. Cela est presque maladif chez Guillard. Il ne peut s&#x27;empêcher de tout classer et on peut le voir errer derrière les clients de la librairie afin de nettoyer et de remettre en ordre tous les objets qu&#x27;ils déplacent.Il est aussi un ancien notable de la ville de la librai n## Un initié des Fantômes de l'Aube Dorée\n\nC'est l'un des clients les plus fidèles et les plus acheteurs de la librairie. Pourtant, le docteur Parangon ne l'aime pas. En effet Michel Durand se présente comme un honnête homme désireux de s'instruire en tout. Pourtant, si l'interlocuteur de Durand réussit un jet de psychologie, il s'aperçoit très rapidement que Durand cache sa véritable personnalité sous ses commentaires affables sur la qualité des choix livresques de son vis-à-vis. C'est quelqu'un qui cherche à soutirer le\n\nmoindre renseignement utile pour ses buts ou qui lui servirait à manipuler sa victime dans un futur proche. Il fait partie d'une obédience très secrète des rose-croix issue de la défunte Golden Dawn appelée les fantômes de l'aube dorée. Il sont animés des plus mauvaises intentions et veulent détruire le monde tel qu'il est afin d'instaurer une cité idéale magique dont ils seraient les princes. Parallèlement, Durand est aussi un cadre important de la Bianética (ce qui lui permet de suivre certains agissements des templiers) lui donnant aussi toutes les techniques de manipulation mentale. C'est un très fin psychologue et il risque de reconnaître les psychés étranges de Nephilim discutant avec lui. S'il en est ainsi, il essayera declancer une opération de capture. Il est frustré de ne pas faire partie des initiés de l'incumable souveraineté.\n\n## Le touriste curieux\n\nOn ne peut pas lui donner de nom. Durand un week-end ou des vacances plus longues, le guide bleu sous le bras, il vient visiter la librairie comme l'on visite un château en ruine, avec concentration, silence et timidité devant les clients. Certains n'hésitent pourtant pas à faire semblant de s'intéresser aux vieux livres ou à ennuyer le docteur Parangon en pleine discussion confidentielle. Celui n'hésite pas à les tancer et à jouer de son coté bougon. Bien qu'ils dépareillent un peu dans la librairie, ils repartent souvent avec un petit livre ancien pas très cher mais qui peut les amener plus tard à interroger l'occultisme. Ce livre \"les mystères d'ici et d'en haut\" est édité et vieilli artificiellement par l'imprimeur de la Pente d'Argent, l'un des initiés du docteur Parangon.\n\n## Un jeune manteau noir de l'obédience templière locale\n\nPhilippe Dupraillis est directeur commercial d'une entreprise dynamique. Jeune homme aux dents longues, issu d'une famille modeste (noble à l'origine et déchue durant la Révolution) cherche par tous les moyens à s'imposer dans la société mondaine de la ville de la librairie. C'est pour cette raison qu'il rentra\n", "status": "ok", "seconds": 24.26, "cer": 0.006713018460800768, "wer": 0.0091324200913242, "accent_edits": 0, "inserted_words": 2, "deleted_words": 1, "omitted_blocks": 0, "diff": "<ins>L&#x27;Incumable Souveraineté<\/ins> frer. Il n&#x27;habite pas en ville mais vient très régulièrement à la librairie discourir des sujets les plus pointus avec le docteur Parangon. Il fait partie des initiés de la librairie. La newage fofolle Isabelle Guilloux est une jeune femme svelte (elle ne mange que macrobiotique) toujours habillée de matières dites naturelles comme le coton ou le lin. Elle porte un collier orné d&#x27;une pyramide de cristal et plusieurs bagues sur lesquelles sont gravés des mandala, des Yin/Yang et même des symboles alchimiques. Ce curieux mélange n&#x27;est que l&#x27;expression de la passion d&#x27;Isabelle, le NewAge. Elle croit en la réincarnation, la transmigration des âmes, aux extraterrestres bienfaiteurs, aux pouvoirs guérisseur des cristaux, à l&#x27;astrologie, à l&#x27;aura, à la géobiologie (chez elle, tous les lits sont orientés vers le nord). Lors d&#x27;un voyage mémorable en Californie, elle a expérimenté les caissons d&#x27;eau et d&#x27;oxygène ainsi que les lunettes cycliques (Ce sont des lunettes noires dans lesquelles des petites diodes de différentes couleurs sont implantées. Ces diodes clignotent selon des fréquences bien déterminées et cela lui arrive d&#x27;en  tancer et à jouer de son\ncoté bougon. Bien qu'ils dépareillent un peu\ndans la librairie, ils repartent souvent avec\nun petit livre ancien pas très cher mais qui\npeut les amener plus tard à interroger\nl'occultisme. Ce livre \"les mystères d'ici et\nd'en haut\" est édité et vieilli artificiellement\npar l'imprimeur de la Pente d'Argent, l'un\ndes initiés du docteur Parangon.\n\nUn jeune manteau noir\nde l'obédience templière\nlocale\n\nPhilippe Dupraillis est directeur commercial\nd'une entreprise dynamique. Jeune homme\naux dents longues, issu d'une famille modeste\n(noble à l'origine et déchue durant la Révolu-\ntion) cherche par tous les moyens à s'imposer\ndans la société mondaine de la ville de la\nlibrairie. C'est pour cette raison qu'il rentra\n\n8\n", "status": "ok", "seconds": 169.47, "cer": 0.0004795013186286262, "wer": 0.0030441400304414, "accent_edits": 0, "inserted_words": 0, "deleted_words": 0, "omitted_blocks": 0, "diff": "frer. Il n&#x27;habite pas en ville mais vient très régulièrement à la librairie discourir des sujets les plus pointus avec le docteur <del>Parangon.<\/del> <ins>Paragon.<\/ins> Il fait partie des initiés de la librairie. La newage fofolle Isabelle Guilloux est une jeune femme svelte (elle ne mange que macrobiotique) toujours habillée de matières dites naturelles comme le coton ou le lin. Elle porte un collier orné d&#x27;une pyramide de cristal et plusieurs bagues sur lesquelles sont gravés des mandala, des Yin/Yang et même des symboles alchimiques. Ce curieux mélange n&#x27;est que l&#x27;expression de la passion d&#x27;Isabelle, le NewAge. Elle croit en la réincarnation, la transmigration des âmes, aux extraterrestres bienfaiteurs, aux pouvoirs guérisseur des cristaux, à l&#x27;astrologie, à l&#x27;aura, à la géobiologie (chez elle, tous les lits sont orientés vers le nord). Lors d&#x27;un voyage mémorable en Californie, elle a expérimenté les caissons d&#x27;eau et d&#x27;oxygène ainsi que les lunettes cycliques (Ce sont des Pedro Gorospe, Mari Lertxundi, Arregi Erorstarbe et Mugica Garmendia. Tous résident au mas d'Ibarrolla à Bedarrides.\n\n**Sujet** : Ibarrolla Lantaxki\n\n**Support** : Les secrets du Pays Basque, Basque interdit, les mémoires de la Navarre, les dossier de l'E.T.A. militaire et autres livres très très rares.\n\n**Lieu de la découverte** : Librairie de l'Incunable vérité, bibliothèque du professeur Bernard.\n\n**Résumé de l'information** : Ibarrolla Lantaxki est une société secrête aujourd'hui disparue dont le but était de rêgner secrêtement sur le Pays Basque et de préserver ses intérêts. Ses origines remonteraient à des temps immémoriaux et son influence dans son pays d'origine était phénoménale. Il semble évident qu'elle dirigeait réellement le Pays Basque, surtout lorsque l'on sait que Henri III en faisait partie avant son accession au trône. Il semble qu'elle vénérait une sorte de Dieu, a rapprocher du Baphomet Templier, appelé Ibarrolla. Le nom entier de la société secrête signifie d'ailleurs en vieux basque les gardiens d'Ibarrolla.\n\nElle fut détruite par l'Église Catholique Romaine en 1590, avec l'accord d'Henri III et il n'en reste absolument rien de nos jours. Certains spécialistes de l'occultisme méridionnal laisse entendre qu'avant de mourir Henri III, rongé de remord et de chagrin érdigeat un édit donnant l'indépendance à la Navarre, afin de se faire pardonner. Nul ne sait où se trouve actuellement cet édit si tant est qu'il existe. Le plus grand prêtre de cette société secrête avait pour nom Aralar.\n\n## Épilogue et fins multiples\n\nCe scénario peut se terminer très grossièrement de deux façons. Soit les joueurs échouent et Ibarrolla est libéré de sa prison de terre. Il reprend alors le commandement de sa société secrète et entreprend de la redonner sa puissance passée. Aidé par le ressources d'Ibarrolla S.A. il prend littéralement possession du Pays Basque. Cette pris de pouvoir est souterraine et prend de longues années. Il va réveiller les indépendantistes et se mettre à rechercher des armes magiques aussi puissantes que celles utilisées lors de l'Atlantide. C'est pour cette raison qu'il pourra commencer des incursions sur les plans subtils de l'Agartha sans succès au début. L'on verra dans les années proches, un développement important de cultes new-ages sur l'atlantide dans le pays basque. Des pseudo-historiens développeront des thèses à-priori hallucinantes sur les origines atlantes des basques. Puis des preuves seront dévoilées au grand public pour lui faire accepter l'idée. Enfin Ibarrolla se basera sur ces \"nouvellesdonnes historiques\" pour revendiquer l'autonomie politique du pays basque. A vous de décider si cette indépendance est possible ou non.\n\nAu niveau politique cette indépendance se noiera dans le flot de Balkanisation des pays de l'est et ne change économiquement pas grand chose. Au niveau occulte par contre les Basques déclareront la guerre à toutes les sociétés secrètes et se lanceront dans un gigantesque campagne pour sauver le Nephilim à travers le monde. Tout cela ne se fera pas sans mal et pourra donner lieu à des multiples aventures. Dans la campagne MultiSim officielle, il est prévu que le pays basque conduit par Ibarrolla serve de refugi aux Nephilim dans les futures guerres de l'Apocalypse prévues pour 1999. Et revanche, il ne faut pas oublier qu'Ibarrolla est un Nephilim proche de l'agartha et qu'il est sur-puissant. Il est très autoritaire et conduit de main de fer son peuple. Il a tendance à faire de même avec les autres Nephilim. Une faction des Nephilim de l'arcan majeur Le Pape va le considérer comme le futur prince de cet arcane. Cela ne va pas sans poser des problèmes au reste du Pape.\n\nSi Ibarrolla n'est pas libéré. Rien ne change dans le vaste monde oculte.\n", "status": "ok", "seconds": 24.93, "cer": 0.0026714158504007124, "wer": 0.015536723163841809, "accent_edits": 0, "inserted_words": 0, "deleted_words": 0, "omitted_blocks": 0, "diff": "Lieu de la découverte: Min u début. L'on verra dans les années\nproches, un développement important de\ncultes new-ages sur l'atlantide dans le pays\nbasque. Des pseudo-historiens développe-\nront des thèses à-priori hallucinantes sur les\norigines atlantes des basques. Puis de\npreuves seront dévoilées au grand public\npour lui faire accepter l'idée. Enfin Ibarrolla\nse basera sur ces \"nouvelles données histo-\nriques\" pour revendiquer l'autonomie poli-\ntique du pays basque.  A vous de décider si\ncette indépendance est possible ou non.\n\nAu niveau politique cette indépendance s'\nnoiera dans le flot de Balkanisation des pays\nde l'est et ne change économiquement pas\ngrand chose. Au niveau occulte par contre\nles Basques déclareront la guerre à toutes les\nsociétés secrètes et se lanceront dans un\ngigantesque campagne pour sauver le\nNephilim à travers le monde. Tout cela ne se\nfera pas sans mal et pourra donner lieu à de\nmultiples aventures. Dans la campagne Mul-\ntiSim officielle, il est prévu que le pays\nbasque conduit par Ibarrolla serve de refuge\naux Nephilim dans les futures guerres de\nl'Apocalypse prévues pour 1999. En\nrevanche, il ne faut pas oublier qu'Ibarrolla\nest un Nephilim proche de l'agartha et qu'il\nest sur-puissant. Il est très autoritaire et\nconduit de main de fer son peuple. Il a ten-\ndance à faire de même avec les autres Nephi-\nlim. Une faction des Nephilim de l'arcane\nmajeur Le Pape va le considérer comme\nfutur prince de cet arcane. Cela ne va pas\nsans poser des problèmes au reste du Pape.\n\nSi Ibarrolla n'est pas libéré. Rien ne change\ndans le vaste monde occulte.\n\n46\n", "status": "ok", "seconds": 174.38, "cer": 0.0091273374888691, "wer": 0.038135593220338986, "accent_edits": 5, "inserted_words": 11, "deleted_words": 1, "omitted_blocks": 0, "diff": "<ins>L E L I O N V E R T<\/ins> Lieu de la découverte: Minitel, chambre du commerce, société d&#x27;audit. Résumé de l&#x27;information: Créée en 1808 cette société anonyme est une des plus vieilles ans la pièce secrète dissimulée derrière la salle de vente. Ils se heurteront au Bec qui est dans cette salle et découvriront l'horrible pélican affolé. Le grand pélican cherchera à composer avec les Nephilim afin de permettre à ses chevaliers d'arriver.\n\n3: les Nephilim laissent quelqu'un d'autre acheter les bracelets. La princesse alors dira que l'acheteur n'a acheté que le symbole de\n\nson véritable achat trop précieux pour être nommé directement. Elle montrera alors du doigt les Nephilim et les chevaliers s'avanceront menaçants.\n\nCe ne sont que quelques possibilités!! A vous d'en trouver d'autres et d'en imaginer en fonction des réactions de vos Nephilim.\n\n## Scène 8: Le vol du Pélican\n\nAprès la scène de la salle de vente, vous pouvez imaginer la fin que vous souhaitez., la jouer plus tard chez vous. Si les Nephilim ont réussi le scénario, ils vont chercher à boire le sang magique du Grand Pélican afin de retrouver leur souvenir et leur compétences perdues. Celles-ci correspondent à une époque d'incarnation appelée: La Venise du Doge Gritti 1520. A vous d'en dessiner les grands traits.\n\nSi les Nephilim ont raté le scénario, ils sont fait prisonniers par les chevaliers du pélican qui les emprisonnent avec les bracelets de Mnemos. Ils perdront de nouveaux tout les souvenirs de cette incarnation.\n\nLes Nephilim peuvent aussi avoir compris ce qui leur arrive mais vous pouvez continuer le scénario en faisant fuir le Grand Pélican dans la Venise occulte et lancer les Nephilim sur ses traces.\n", "status": "ok", "seconds": 20.84, "cer": 0.0003068425897514575, "wer": 0.0018450184501845018, "accent_edits": 0, "inserted_words": 0, "deleted_words": 0, "omitted_blocks": 0, "diff": "Ils peuvent aussi remarquer les deux caméras cachées dans des moulures qui permettent au Grand Pélican de suivre la vente. Puis entre deux statuettes crétoises érotiques, le Grand Pélican fait glisser dans la vente ses cinq fioles dorées. Ces fioles contiennent un peu de sang magique oire originale p. 103\n\nV. La Nécromancie originale p. 115\n\nIndex p. 124\n", "furniture": []}, {"id": "livre-noir-0018", "set": "scans", "group": "Le Livre Noir", "image": "../inputs/images/livre-noir-0018.llm.png", "full_image": "../inputs/images/livre-noir-0018.png", "engines": {"marker2": {"raw": "## *Les froids bibliothécaires des âmes perdues*\n\nFOR : 3 d6\n\nCONS : 2d6\n\nDEX : 3d6\n\nKa-Lune Noire : 15\n\nPdV : comme Ka.\n\nMvt : 7\n\nActions : 2-4\n\nEntropie : 1 par heure\n\nContrôle : non\n\nProtection : 1 point de chair\n\nAttaques : néant.\n\nCompétences : mémoriser son environnement 80 %, empathie 75 %.\n\n**Description :** ces entités sont de vastes fleurs de chair blême, frangées d'yeux et de bouches, juchées sur une multitude de pattes insectoïdes. Elles sont relativement courantes dans les cimetières dominées par les Selenim, qui les apprécient pour leur infaillible mémoire et leur totale absence d'émotions. Leur principale utilité est de servir d'administrateurs. Une fois invoquée, ils passent leur temps à entrer et sortir des champs de Lune Noire, à se promener dans le cimetière et à écouter les morts. Ils enregistrent tout, radotages ou visions pénétrantes sur l'au-delà, sans passion et sans discrimination. Certains Selenim en conservent plusieurs dizaines, un pour chaque cimetière qu'ils ont « administré ».\n\n**Notes :** à leur manière froide, ces créatures accomplissent un sacerdoce et le savent. Au sein de leurs pétales reposent le savoir de toutes les générations humaines ayant vécu depuis des millénaires. Les Selenim y voient des outils pratiques ou des jouets amusants, mais il est permis de se demander pourquoi les Bibliothécaire se sont consacrés à cette tâche ingrate. La théorie la plus communément admise est qu'ils sont dépourvus de créativité et d'émotions, et que l'imagination humaine les fascine, mais il existe une foule de possibilités plus sinistres...\n", "status": "ok", "seconds": 12.67, "cer": 0.0012970168612191958, "wer": 0 {"marker2": {"raw": "## elui qui arpente Le sentier obscur\n\nFOR : 5d6\n\nCONS : 3d6\n\nDEX : 4d6\n\nKa-Lune Noire : 20\n\nPdV : comme Ka\n\nMvt : 8\n\nActions : 2-5\n\nEntropie : 1 par heure\n\nContrôle : non\n\nProtection : 0\n\nAttaques\n\n% att\n\nDommages\n\nDuel spirituel\n\nKLN/KLN\n\nle perdant cède 1d6 points de KLN au vainqueur\n\n**Compétences :** toutes les compétences intellectuelles à des scores variant entre 30 et 50 %.\n\n**Description :** cette entité est une énigme, et rares sont les Selenim qui peuvent se vanter de lui avoir parlé. Elle adopte une forme et, dans une certaine mesure, une personnalité différente à chaque apparition. Seule constante, le double spectral qui l'accompagne à quelques pas en arrière, dont l'apparence ne change jamais. C'est un petit homme à lunettes, qui à l'air terrorisé et murmure des choses comme « je dois m'éveiller ». Parfois, la créature attaque son invocateur à vue. A d'autres moments, elle est relativement amicale. Généralement, elle se borne à donner des conseils, mais on l'a vue négocier des trêves entre ennemis jurés...\n\n**Notes :** la nature de cette créature pose problème. La théorie en vigueur est qu'il s'agisse de la création d'un Selenim particulièrement doué. Mais certains excentriques soutiennent qu'il s'agit de la projection astrale du maître d'un Royaume, voire d'un Selenim qui aurait réussi la fusion ultime avec son simulacre, absorbant la personnalité de ce dernier avant de le quitter.\n", "status": "ok", "seconds": 13.0, "cer": 0.0014619883040935672, "wer": 0.0091324200913242, "accent_edits": 0, "inserted_words": 0, "deleted_words": 0, "omitted_blocks": 0, "diff": "<del>Celui<\/del> <ins>elui<\/ins> qui arpente <del>le<\/del> <ins>Le<\/ins> sentier obscur FOR: 5d6 CONS: 3d6 DEX: 4d6 KaLune Noire: 20 PdV: comme Ka Mvt: 8 Actions: 25 Entropie: 1 par heure Contrôle: non Protection: 0 Attaques % att Dommages Duel spirituel KLN/KLN le perdant cède 1d6 points de KLN au vainqueur Compétences: toutes les Royaume, voire d’un Selenim qui aurait réussi la fusion ultime avec son\nsimulacre, absorbant la personnalité de ce dernier avant de le quitter.\n", "furniture": ["Le Livre Noir - La Kabbale Noire", "30"]}, {"id": "livre-noir-0046", "set": "scans", "group": "Le Livre Noir", "image": "../inputs/images/livre-noir-0046.llm.png", "full_image": "../inputs/images/livre-noir-0046.png", "engines": {"marker2": {"raw": "— Création d'effets-Dragon —Utilisez la procédure de création d'entités de Kabbale Noire, présentée p. 9, en substituant un jet de Pavane au jet de Kabbale. Il s'agit exactement du même pouvoir, envisagé sous un angle différent... Il est tout de même important de se souvenir que les créatures ainsi formées ont tendance à être un peu plus étranges que les entités imaginées par les kabbalistes. Il y a cela une raison simple : le kabbaliste peut se reposer sur la vue. Pour le chanteur de Pavane, c'est l'ouïe qui est le sens dominant. Du coup, ses effets-Dragon n'ont guère de corps physique, mais se manifestent par le son...\n\n![]()**Effet** : cet effet très puissant permet au Selenim de doter pendant quelques minutes une partie de la Pavane d'une conscience rudimentaire. Selon certains mystiques, le Selenim se contente d'accéder à une conscience préexistante. La « personnalité » de la Pavane a l'air d'être plus ou moins constante, ce qui étaye cette hypothèse. Elle est lente à réagir, peu coopérative, souvent malveillante, mais disposée à rendre un service à un Selenim qui lui semble « intéressant ». Cette entité est presque omnisciente (elle « voit » par la totalité des champs de Lune Noire de la région), et peut délivrer des renseignements précieux si l'on parvient à s'en faire comprendre. Par ailleurs, elle exerce (et pour cause !) une incontestable autorité sur les effets-Dragon qui vivent en elle (qu'elle perçoit plus ou moins comme des parasites). Elle peut tout à fait en « prêter » quelques-uns au Selenim. En revanche, elle est totalement incapable d'agir physiquement. Il semble que cette manifestation ne soit jamais sans conséquence sur le monde physique. Il est impossible d'établir des statistiques précises, mais le « contrecoup » mystique de cette apparition se traduit généralement par un désastre. La dernière fois que ce chant a été entonné, c'était à Londres en 1665, au cours d'une des dernières escarmouches entre le culte et l'Arcane. L'épidémie de peste a éclaté deux jours plus tard...\n\n**Coût** : 50 points de KLN. Il est possible de répartir ce coût entre plusieurs chanteurs, pour peu qu'ils remplissent tous les conditions indiquées plus haut.\n\n**Durée** : 1d6 minutes.\n\n![]()**Effet** : ce chant permet de « dissoudre » une créature de Lune Noire. Précisons tout de suite à l'attention des joueurs vicieux qu'il ne fonctionne pas sur les Selenim (trop cohérents, et trop peu liés à la Pavane). En revanche, il est très efficace sur les créatures de Kabbale. Quant aux Sans Repos, ils y sont sujets, mais y sont beaucoup moins sensibles.\n\n**Coût** : 2 points de KLN par point de vie perdu pour une créature de kabbale. Pour les Sans Repos, comptez 5 points de Ka par point de KLN détruit. A zéro points de Ka-Lune Noire, le Sans Repos est mort.\n\n**Durée** : instantané.\n", "status": "ok", "seconds": 18.96, "cer": 0.015439856373429085, "wer": 0.017857142857142856, "accent_edits": 0, "inserted_words": 0, "deleted_words": 7, "omitted_blocks": 0, "diff": "- Création d&#x27;effetsDragon <del>-<\/del> <ins>-Utilisez<\/ins> <del>Utilisez<\/del> la procédure de création d&#x27;entités de Kabbale Noire, présentée p. 9, en substituant un jet de Pavane au jet de Kabbale. Il s&#x27;agit exactement du même pouvoir, envisagé sous un angle différent... Il est tout de même important de se souvenir que les créatures ainsi formées ont tendance à être un peu plus étranges que les entités imaginées par les kabbalistes. Il y a cela une raison simple: le kabbaliste peut se reposer sur la vue. Pour le chanteur de Pavane, c&#x27;est t le vacarme des conversations à un bruit de fond presque imperceptible. L'esprit est toujours libre, s'il le désire, de se concentrer pour capter une discussion précise et peut y participer sans difficultés. Ce sort est assez peu employé, tout simplement parce que les morts qui demandent à en bénéficier sont très rares. Par ailleurs, les Selenim n'accèdent pas à toutes les demandes. Le silence, même relatif, a souvent des effets imprévus et délétères sur le psychisme des morts.\n\n**Coût :** 2 points\n\n**Durée :** permanent, ou jusqu'à ce que le Selenim décide de le rompre.\n\n## Chant de L'âme TORTURÉE\n\n**Effet :** ce sort a plusieurs usages, variant de l'utile à l'abominable selon la personnalité du nécromant. En le lançant, le Selenim libère une partie du KS résiduel de l'esprit, qui « brûle » dans un hurlement que nombre de nécromants trouvent particulièrement musical. Le mort peut se retrouver réduit à un état végétatif, ou être tout simplement purgé de ses traumatismes les plus douloureux, selon le désir du Selenim. Certains en font un outil de purification, grâce auquel leurs morts se libèrent de leurs souvenirs les plus pesants. D'autres préfèrent, égoïstement, organiser des « concerts de souffrances », détruisant des dizaines de morts pour obtenir l'aria de douleur la plus pure. Enfin, une minorité emploie ce sort comme signal d'alarme (en le combinant avec Déclenchement conditionnel, voir plus bas), ou tout simplement comme « élément d'ambiance », comme contrepoint à la Pavane de leur cimetière.\n\n**Coût :** 3 points de KLN par point de KS à détruire. Il est impossible de brûler ainsi plus de la moitié du KS résiduel d'un esprit.\n\n**Durée :** le lancement prend trois actions par point de KS à détruire, et les effets se prolongent pendant cinq minutes par point de KS détruit.\n", "status": "ok", "seconds": 13.75, "cer": 0.004682622268470343, "wer": 0.006557377049180328, "accent_edits": 0, "inserted_words": 0, "deleted_words": 0, "omitted_blocks": 0,
