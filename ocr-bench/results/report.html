ésors occultes. L&#x27;homme dont le corps fut découvert par les serviteurs du Bâton me dépassait de quelques centimètres, mais comme il se tenait souvent voûté, sa colonne vertébrale était arcboutée, et ils furent trompés par ma mascarade. Heureusement... Ce soirlà, je n&#x27;étais pas très loin; je m&#x27;étais dissimulé derrières un rempart de buissons et d&#x27;arbustes de ma propriété, et je les ai entendus se féliciter. Ils avaient traqué, débusqué et tué SaintAmand, l&#x27;insaisissable, celui qui avait trahi son ancêtre. Évidemment, ils regrettaient de n&#x27;avoir récupéré que quelques notes à propos d&#x27;une Fraternité de Déchus, et de ne pas pouvoir percer mon mystère. Dès qu&#x27;ils eurent quitté les lieux, chassés par les sirènes des forces de l&#x27;ordre et des premiers secours, je fuyais à mon tour les flammes qui léchaient les cieux, ne laissant derrière moi que des cendres. Je me rendis ensuite dans mon sanctuaire où j&#x27;attendis que les héritiers d&#x27;Épiméthée n&#x27;endorsent leur lourde responsabilité et mènent leur combat jusqu&#x27;au bout. Aujourd&#x27;hui, je peux l&#x27;avouer, je ne fus pas étranger à l&#x27;intervention de ce fou de Pélican, à Lyon, en février 1999. Mais cette petite trahison était nécessaire. Et puis, elle est de l&#x27;histoire ancienne. Pourquoi aije travesti ma propre mort?, vous demandezvous. Pour ne pas gêner le Kwisatz Haderach et ses héritiers, pour ne pas empêcher leur destinée de s&#x27;accomplir,... Pour que l&#x27;Apocalypse ait lieu. Si vous m&#x27;aviez cru parmi vous, vous auriez été tenté de me rendre visite, de me demander conseil; et là vous auriez compris que j&#x27;en sais bien plus que je ne le laisse croire depuis tant d&#x27;année, peutêtre même m&#x27;auriezvous percé à jour et aujourd&#x27;hui vous le regretteriez. Oui. Je savais que l&#x27;Apocalypse aurait lieu. J&#x27;en connaissais la nature depuis la nuit des temps. Mais je sais également, depuis toujours, que ma présence aurait pu tout faire rater. Si vous m&#x27;aviez cru en vie, rien n&#x27;aurait fonctionné: le Monde serait tel que vous l&#x27;avez connu, les Sauriens se terreraient encore, et le 666 agirait toujours dans l&#x27;ombre de l&#x27;Histoire Invisible. Ma disparition et mon silence étaient nécessaires. Vous perdez patience? Bien. Laissons alors à l&#x27;année 1999 ses événements, et parlons plutôt de moi, de ce que je suis et de ce que j&#x27;ai à vous transmettre. Soulevez le voile d&#x27;Isis, pénétrez dans mon sanctuaire, laissez l&#x27;odeur fauve de mon corps vous étourdir et troublez vos sens, et maintenant que vous êtes ivre, contemplez ma véritable nature. Je suis celui que les Couronnés nomme Le Sphinx, L&#x27;Énigme. Je suis l&#x27;unique Kaïm qui trouva l&#x27;Agartha avant que la Chute n&#x27;ait dispersé notre mémoire. Ne soyez pas si surpris. Vous deviez vous douter que je n&#x27;étais pas comme tous les hommes. Attendez. Ne vous emportez pas. Il faut me croire. Écoutez mon histoire. Alors que les Champs magiques n&#x27;étaient pas encore souillés par l&#x27;Orichalque, tout comme vous, j&#x27;étais préoccupé par le Sentier d&#x27;Or. Chacun de mes Cycles basaltiques n&#x27;était qu&#x27;un prétexte de plus pour percer les mystères du Graal Primordial et des flux élémentaires qui le baignent sans cesse. Lorsque que les Kaéléments de mon Pentacle ne se mêlaient pas aux Champs magiques, j&#x27;étudiais les hommes. Comme vous, leur KaSoleil m&#x27;obsédait, je cherchais à comprendre. Tous les moyens étaient bons, seul comptait le résultat. Or, rien de très concluant ne se dégageait de mes recherches. Après chaque nouvel échec, je déambulais dans l&#x27;architecture insensée d&#x27;Atantys. Peutêtre espéraisje découvrir dans ces errances les secrets de l&#x27;Éther solaire; peutêtre croyaisje alors qu&#x27;elles me livreraient la clef de la nature capricieuse et complexe des hommes. Lorsque c&#x27;est arrivé, j&#x27;errais comme a mon habitude. J&#x27;ai tout d&#x27;abord entendu un sifflement insupportable venant des cieux, je me souviens avoir porté mon regard de ce côtéci et l&#x27;avoir vu. Noire comme la nuit la plus profonde, notre Némésis fonçait droit sur nous. Je me souviens que ce qui me stupéfia le plus fut le calme qui s&#x27;abattit sur l&#x27;Atlantide. La plupart des Kaïm cessèrent leurs jeux élémentaires et regardèrent cet éclat saturnien se précipiter sur eux. Il y en eut néanmoins qui trouvèrent la force de libérer les hommes de leurs geôles ou celle de fuir au loin. Pour ma part, alors que je contemplais Orichalka qui accouraient à notre rencontre, j&#x27;avais poursuivit, bien malgré moi, mon chemin. J&#x27;étais arrivé au coeur de notre cité. D&#x27;autres Kaïm se trouvaient là, attendant la fin. Et puis, il y eut de nouveau un insupportable sifflement. Mais celuici venait de l&#x27;endroit où je me trouvais. La pyramide qui trônait au coeur d&#x27;Atlantys venait de se fracturer, libérant un souffle puissant qui emporta dans un océan de souffrance bon nombre des Kaïm qui se trouvaient là. Je sais aujourd&#x27;hui qu&#x27;ils s&#x27;y noyèrent. En compagnie de quelques autres, je regardais cette Pierre disparaître dans les courants solaires qui fragmentaient notre cité, les propulsant dans les méandres chaotiques de cet océan fantomatique. Je me souviens que je la regardais intensément. Puis, je ressentis le besoin de la suivre, de me fondre dans son aveuglante clarté. Et cela me sauva. La chose dont je me souviens ensuite est d&#x27;avoir ouvert les yeux sur une plaine stérile où des Kaïm devenaient des Nephilim. Ils fuyaient devant des meutes d&#x27;hommes ivres de colère et assoiffés de vengeance. Depuis ce jour, mon corps est celui d&#x27;un homme. Je n&#x27;ai pas de Métamorphe. Il m&#x27;arrive parfois d&#x27;oublier des siècles entiers ce que je suis, mais je me&quot;réveille&quot;toujours. L&#x27;époque est différente mais je me souviens de tout ce que je fis pendant l&#x27;absence de ma conscience occulte, lorsque je ne suis, en quelque sorte, qu&#x27;un homme. Ne me demandez pas pourquoi cela m&#x27;est arrivé? Pourquoi moi? Je l&#x27;ignore. Par contre, je sais que ma mission ne fait que commencer. Elle me l&#x27;a dis. Elle? L&#x27;Iz peutêtre. Enfin je me plais à l&#x27;imaginer mais c&#x27;est peutêtre cette Pierre ou même le Cosmos. Qui sait? Pardonnezmoi mais je n&#x27;ai plus beaucoup de temps. Je sais que je dois vous guider dans les Guerres de l&#x27;Apocalypse pour qu&#x27;ensemble nous bâtissions l&#x27;avenir. Mais ne vous méprenez pas. Bien que je connaisse les questions que nous devrons nous poser, je ne possède pas les réponses. Et je ne les chercherais pas. C&#x27;est à vous de les trouver, et ainsi, vous me rejoindrez. Alors, vous serez Agarthien. Comme moi. A<\/del>"}, "marker2-force": {"raw": "Mes Frères,\n\nle temps est venu pour moi de taire les mensonges dont je vous abreuve depuis tant d'année. Il est temps en effet de vous révéler la vérité. Mais auparavant, quelques détails restes dans l'ombre doivent être mis en pleine lumière.\n\nJe ne suis pas mort. Enfin, pas au sens où vous l'entendez. À la fin de l'année 1998, j'ai dù travestir avec mes sorts le corps d'un malbeureux clochard, un innocent, afin que nos ennemis découvrent dans mon bureau sa dépouille carbonisée par le terrible feu que les hommes de Tubalcaan libérèrent dans ma demeure. Ne vous inquiètez pas; je m'attendais à leur visite, et j'avais quelques semaines plus tôt vidé ma bibliothèque de ses livres anciens et de ses trèsors occultes.\n\nL'homme dont le corps fut découvert par les serviteurs du Bâton me dépassait de quelques centimètres, mais comme il se tenait souvent voûté, sa colonne vertébrale était arc-boutée, et ils furent trompés par ma mascarade. Heureusement...\n\nCe soir-là, je n'étais pas très loin; je m'étais dissimulé derrières un rempart de buissons et d'arbustes de ma propriété, et je les ai entendus se féliciter. Ils avaient traqué, débusqué et tué Saint-Amand, l'insaissable, celui qui avait trahi son ancètre. Évidemment, ils regrettaient de n'avoir récupéré que quelques notes à propos d'une Fraternité de Déchus, et de ne pas pouvoir percer mon mystère.\n\nDès qu'ils eurent quitté les lieux, chassés par les sirènes des forces de l'ordre et des premiers secours, je fuyais à mon tour les flammes qui léchaient les cieux, ne laissant derrière moi que des cendres. Je me rendis ensuite dans mon sanctuaire où j'attendis que les héritiers d'Épinéthée n'endorsent leur lourde responsabilité et mènent leur combat jusqu'au bout. Aujourd'hui, je peux l'avouer, je ne fus pas étranger à l'intervention de ce fon de Pélican, à Lyon, en février 1999. Mais cette petite trabison était nécessaire. Et puis, elle est de l'histoire ancienne.\n\nPourquoi ai-je travesti ma propre mort?, vous demandez-vous. Pour ne pas gèner le Kwisaty Haderach et ses héritiers, pour ne pas empêcher leur destinée de s'accomplir... Pour que l'Apocalypse ait lieu. Si vous m'aviez cru parmi vous, vous auriez été tenté de me rendre visite, de me demander conseil; et là vous auriez compris que j'en sais bien plus que je ne le laisse croire depuis tant d'année, peut-être même m'auriez-vous percé à jour et aujourd'hui vous le regretteriez.\n\nOui. Je savais que l'Apocalypse aurait lieu. J'en connaissais la nature depuis la muit des temps. Mais je sais également, depuis toujours, que ma présence aurait pu tout faire rater. Si vous m'aviez cru en vie, rien n'aurait fonctionné: le Monde serait tel que vous l'avez connu, les Sauriens se terresaient encore, et le 666 agirait toujours dans l'ombre de l'Histoire Invisible. Ma disparition et mon silence étaient nécessaires.\n\nVous perdez patience?\n\nBien laissons alors à l'année 1999 ses événements, et parlons plutôt de moi, de ce que je suis et de ce que j'ai à vous transmettre. Soulevez le voile d'Isis, pénétrez dans mon sanctuaire, laissez l'odeur fauve de mon corps vous étourdir et troublez vos sens, et maintenant que vous êtes ivre, contemplez ma véritable nature.\n\nJe suis celui que les Couronnés nomme le Sphinx, l'Énigme. Je suis l'unique Kaim qui trouva l'Agartha avant que la Chute n'ait dispersé notre mêmoire.\n\nNe soyez pas si surpris. Vous deviez vous douter que je n'étais pas comme tous les hommes. Attendez. Ne vous emportez pas. Il faut me croire. Écoutez mon histoire.\n\nAlors que les Champs magiques n'étaient pas encore souillés par l'Orichalque, tout comme vous, j'étais préoccupé par le Sentier d'Or. Chacun de mes Cycles basaltiques n'était qu'un prétexte de plus pour percer les mystères du Graal Primordial et des flux élémentaires qui le baignent sans cesse. Lorsque que les Ka-éléments de mon Pentacle ne se mêlaient pas aux Champs magiques, j'étudiais les hommes. Comme vous, leur Ka-Soleil m'absédait, je cherchais à comprendre. Tous les moyens étaient bons, seul comptait le résultat. Or, rien de très concluant ne se dégageait de mes recherches. Après chaque nouvel échec, je déambulais dans l'architecture insensée d'Atlantys. Peut-être espérais-je découvrir dans ces errances les secrets de l'Éther solaire; peut-être croyais-je alors qu'elles me livreraient la clef de la nature capricieuse et complexe des hommes.\n\nLorsque c'est arrivé, j'erais comme a mon habitude. J'ai tout d'abord entendu un sifflement insupportable venant des cieux, je me souviens avoir porté mon regard de ce côté-ci et l'avoir vu. Noire comme la muit la plus profonde, notre Néménis fonsait droit sur nous. Je me souviens que ce qui me stupéfia le plus fut le calme qui s'abattit sur l'Atlantide. La plupart des Kaim cessèrent leurs jeux élémentaires et regardèrent cet éclat saturnien se précipiter sur eux. Il y en eut néanmoins qui trouvèrent la force de libérer les hommes de leurs geôles ou celle de fuir au loin. Pour ma part, alors que je contemplais Orichalka qui accouraient à notre rencontre, j'avais poursuivit, bien malgré moi, mon chemin. J'étais arrivé au cœur de notre cité. D'autres Kaim se trouvaient là, attendant la fin. Et puis, il y eut de nouveau un insupportable sifflement. Mais celui-ci venait de l'endroit où je me trouvais. La pyramide qui trônait au cœur d'Atlantys venait de se fracturer, libérant un souffle puissant qui emporta dans un océan de souffrance bon nombre des Kaim qui se trouvaient là. Je sais aujourd'hui qu'ils s'y noujerent.\n\nEn compagnie de quelques autres, je regardais cette Pierre disparaître dans les courants solaires qui fragmentaient notre cité, les propulsant dans les méandres chaotiques de cet océan fantomatique. Je me souviens que je la regardais intensément.\n\nPuis, je resentis le besoin de la suivre, de me fondre dans son aveuglante clarté. Et cela me sauva.\n\nLa chose dont je me souviens ensuite est d'avoir ouvert les yeux sur une plaine stérile où des Kaim devenaient des Nephilim. Ils fuyaient devant des meutes d'hommes ivres de cotère et assoiffés de vengeance.\n\nDepuis ce jour, mon corps est celui d'un homme. Je n'ai pas de Métamorphe.\n\nIl m'arrive parfois d'oublier des siècles entiers ce que je suis, mais je me « réveille » toujours. L'épaque est différente mais je me souviens de tout ce que je fis pendant l'absence de ma conscience occulte, lorsque je ne suis, en quelque sorte, qu'un homme.\n\nNe me demandez pas pourquoi cela m'est arrivé? Pourquoi moi? Je l'ignore. Par contre, je sais que ma mission ne fait que commencer. Elle me l'a dis. Elle? L'Ig peut-être. Enfin je me plais à l'imaginer mais c'est peut-être cette Pierre ou même le Cosmos. Qui sait?\n\nPardonnez-moi mais je n'ai plus beaucoup de temps. Je sais que je dois vous guider dans les Guerres de l'Apocalypse pour qu'ensemble nous bâtissions l'avenir. Mais ne vous méprenez pas. Bien que je connaisse les questions que nous devons nous poser, je ne possède pas les réponses. Et je ne les chercherais pas. C'est à vous de les trouver, et ainsi, vous me rejoindrez.\n\nAlors, vous serez Agarthien. Comme moi.\n", "status": "ok", "seconds": 40.46, "ce us transmettre. Soulevez le\nvoile d'Isis, pénétrez dans mon sanctuaire, laissez l'odeur fauve de mon\ncorps vous étourdir et troublez vos sens, et maintenant que vous êtes ivres,\ncontemplez ma véritable nature.\n\nJe suis celui que les Couronnés nomme le Sphinx, l'Énigme. Je suis\nl'unique Kaïm qui trouva l'Agartha avant que la Chute n'ait dispersé\nnotre mémoire.\n\nNe soyez pas si surpris. Vous deviez vous douter que je n'étais pas\ncomme tous les hommes. Attendez. Ne vous emportez pas. Il faut me croire.\nÉcoutez mon histoire.\n\nAlors que les Champs magiques n'étaient pas encore souillés par l'Ori-\nchalque, tout comme vous, j'étais préoccupé par le Sentier d'Or. Chacun\nde mes Cycles basaltiques n'était qu'un prétexte de plus pour percer les\nmystères du Graal Primordial et des flux élémentaires qui le baignent\nsans cesse. Lorsque que les Ka-éléments de mon Pentacle ne se mêlaient\npas aux Champs magiques, j'étudiais les hommes. Comme vous, leur Ka-\nSoleil m'obsédait, je cherchais à comprendre. Tous les moyens étaient\nbons, seul comptait le résultat. Or, rien de très concluant ne se dégageait\nde mes recherches. Après chaque nouvel échec, je déambulais dans l'archi-\ntecture insensée d'Atlantys. Peut-être espérais-je découvrir dans ces errances\nles secrets de l'Éther solaire ; peut-être croyais-je alors qu'elles me livre-\nraient la clef de la nature capricieuse et complexe des hommes.\n\nLorsque c'est arrivé, j'étais comme à mon habitude. J'ai tout d'abord\nentendu un sifflement insupportable venant des cieux, je me souviens\navoir porté mon regard de ce côté-ci et l'avoir vu. Noire comme la nuit\nla plus profonde, notre Némésis fonçait droit sur nous. Je me souviens\nque ce qui me stupéfia le plus fut le calme qui s'abattit sur l'Atlantide.\nLa plupart des Kaïm cessèrent leurs jeux élémentaires et regardèrent cet\néclat saturnien se précipiter sur eux. Il y en eut néanmoins qui trouvè-\nrent la force de libérer les hommes de leurs geôles ou celle de fuir au loin.\nPour ma part, alors que je contemplais Orichalka qui accouraient à notre\nrencontre, j'avais poursuivi, bien malgré moi, mon chemin. J'étais arrivé\nau cœur de notre cité. D'autres Kaïm se trouvaient là, attendant la fin.\nEt puis, il y en eut de nouveau un insupportable sifflement. Mais celui-ci\nvenait de l'endroit où je me trouvais. La pyramide qui trônait au cœur\nd'Atlantys venait de se fracturer, libérant un souffle puissant qui emporta\ndans son océan de souffrance bon nombre des Kaïm qui se trouvaient là.\nJe sais aujourd'hui qu'ils s'y noyèrent.\n\nEn compagnie d'autres, je regardais cette Pierre disparaître\ndans les courants solaires qui fragmentaient notre cité, les propulsant\ndans les méandres chaotiques de cet océan fantomatique. Je me souviens\nque je la regardais intensément.\n\nPuis, je ressentis le besoin de la suivre, de me fondre dans son aveu-\nglante clarté. Et cela me sauva.\n\nLa chose dont je me souviens ensuite est d'avoir ouvert les yeux sur\nune plaine stérile où des Kaïm devenaient des Nephilim. Ils fuyaient\ndevant des meutes d'hommes ivres de colère et assoiffés de vengeance.\n\nDepuis ce jour, mon corps est celui d'un homme. Je n'ai pas de Méta-\nmorphe.\n\nIl m'arrive parfois d'oublier des siècles entiers ce que je suis, mais je\nme « réveille » toujours. L'époque est différente mais je me souviens de\ntout ce que je fis pendant l'absence de ma conscience occulte, lorsque je\nne suis, en quelque sorte, qu'un homme.\n\nNe me demandez pas pourquoi cela m'est arrivé ? Pourquoi moi ? Je\nl'ignore. Par contre, je sais que ma mission n'a fait que commencer. Elle\nme l'a dit. Elle ? Il/z peut-être. Enfin je me plais à l'imaginer mais c'est\npeut-être cette Pierre ou même le Cosmos. Qui sait ?\n\nPardonnez-moi mais je n'ai plus beaucoup de temps. Je sais que je dois\nvous guider dans les Guerres de l'Apocalypse pour qu'ensemble nous bâtis-\nsions l'avenir. Mais ne vous méprises pas. Bien que je connaisse les ques-\ntions que vous devrons nous poser, je ne possède pas les réponses. Et je ne\nles chercherai pas. C'est à vous de les trouver, et ainsi, vous me rejoin-\ndrez.\n\nAlors, vous serez Agarthien. Comme moi.\n\n96\n", "status": "ok", "seconds": 72.22, "cer": 0.007515598411798071, "wer": 0.025839793281653745, "accent_edits": 4, "inserted_words": 1, "deleted_words": 3, "omitted_blocks": 0, "diff": "Mes Frères, <del>le<\/del> <ins>Le<\/ins> temps est venu pour moi de taire les mensonges dont je vous abreuve depuis tant d&#x27;année. Il est temps en effet de vous révéler la vérité. Mais auparavant, quelques détails restés dans l&#x27;ombre doivent être mis en pleine lumière. Je ne suis pas mort. Enfin, pas au sens où vous l&#x27;entendez. À la fin de l&#x27;année 1998, j&#x27;ai dû travestir avec mes sorts le corps d&#x27;un malheureux clochard, un innocent, afin que nos ennemis découvrent dans mon bureau sa dépouille carbonisée par le terrible feu que les hommes de Tubalcaan libérèrent dans ma demeure. Ne vous inquiétez pas; je m&#x27;attendais à leur visite, et j&#x27;avais quelques semaines plus tôt vidé ma bibliothèque de ses livres anciens et de ses trésors occultes. L&#x27;homme dont le corps fut découvert par les serviteurs du Bâton me dépassait de quelques centimètres, mais comme il se tenait souvent voûté, sa colonne vertébrale était arcboutée, et ils furent trompés par ma mascarade. Heureusement... Ce soirlà, je n&#x27;étais pas très loin; je m&#x27;étais dissimulé <del>derrières<\/del> <ins>derrière<\/ins> un rempart de buissons et d&#x27;arbustes de ma propriété, et je les ai entendus se féliciter. Ils avaient traqué, débusqué et tué SaintAmand, l&#x27;insaisissable, celui qui avait trahi son ancêtre. Évidemment, ils regrettaient de n&#x27;avoir récupéré que quelques notes à propos d&#x27;une Fraternité de Déchus, et de ne pas pouvoir percer mon mystère. Dès qu&#x27;ils eurent quitté les lieux, chassés par les sirènes des forces de l&#x27;ordre et des premiers secours, je <del mand, l'insaisissable,\ncelui qui avait trahi son ancêtre. Évidemment, ils regrettaient de n'avoir\nrécupéré que quelques notes à propos d'une fraternité de Dikhun, et de ne\npas pouvoir percer mon mystère.\n\nDès qu'ils eurent quitté les lieux, chassés par les sirènes des forces de\nl'ordre et des premiers secours, je vis à mon tour les flammes qui léchaient\nles cieux, ne laissant derrière moi que des cendres. Je me rendis ensuite\ndans mon sanctuaire où j'attendis que les héritiers d'Épiméthée n'endor-\nment leur lourde responsabilité et mènent leur combat jusqu'au bout.\nAujourd'hui, je peux l'avouer, je ne fus pas étranger à l'intervention de\nla force du Pelican, à Lyon, en février 1999. Mais cette petite trahison était\nnécessaire. Et puis, elle est de l'histoire ancienne.\n\nPourquoi ai-je traversé ma propre mort?, vous demandez-vous. Pour\nne pas gêner le Kuwath Hadérick et ses héritiers, pour ne pas empêcher leur\ndestinée de s'accomplir... Pour que l'Apocalypse ait lieu. Si vous m'aviez\neu parmi vous, vous auriez été tenté de me rendre visite, de me deman-\nder conseil; et là vous auriez compris que j'en sais bien plus que je ne le\nlaisse croire depuis tant d'années, peut-être même m'auriez-vous percé à\njour et aujourd'hui vous le regretteriez.\n\nOui, je savais que l'Apocalypse aurait lieu. J'en connaissais la nature\ndepuis la nuit des temps. Mais je sais également, depuis toujours, que ma\nprésence aurait pu tout faire basculer. Si vous m'aviez eu en vie, rien n'au-\nrait fonctionné: le Monde serait tel que vous l'avez connu, les Sauriens\nse terreraient encore, et le 666 agirait toujours dans l'ombre de l'Histoire\ninvisible. Ma disparition et mon silence étaient nécessaires.\n\nVous perdez patience?\nBien. Laissons alors à l'année 1999 ses événements, et parlons plutôt\nde moi, de ce que je suis et de ce que j'ai à vous transmettre. Soulevez le\nvoile d'Iris, pénétrez dans mon sanctuaire, laissez l'odeur suave de mon\ncorps vous étourdir et troubler vos sens, et maintenant que vous êtes ivre,\ncontemplez ma véritable nature.\n\nJe suis celui que les Couronnés nomme le Sphinx, l'É-\nnigme. Je suis\nl'unique Kaïm qui trouva l'Agarttha avant que la Chute n'ait dispersé\nnotre mémoire.\n\nNe soyez pas si surpris. Vous deviez vous douter que je n'étais pas\ncomme tous les hommes. Attendez. Ne vous emportez pas. Il faut me croire.\nÉcoutez mon histoire.\n\nAlors que les Champs magiques n'étaient pas encore souillés par l'Or-\ndalique, tout comme vous, j'étais préoccupé par le Sentier d'Or. Chacun\nde mes Cycles basaltiques n'était qu'un prétexte de plus pour percer les\nmystères du Graal Primordial et des flux élémentaires qui le baignaient\nsans cesse. Lorsque que les Ka-éléments de mon Pentacle ne se mêlaient\npas aux Champs magiques, j'étudiais les hommes. Comme vous, leurs Ka-\nSoleil m'obsédaient, je cherchais à comprendre. Tous les moyens étaient\nbons, seul comptait le résultat. Or, rien de très concluant ne se dégageait\nde mes recherches. Après chaque nouvel échec, je déambulais dans l'archi-\ntecture insensée d'Agarttha. Peut-être espérais-je découvrir dans ces espaces\nles secrets de l'Éther solaire; peut-être croyais-je alors qu'elles me livre-\nraient la clé de la nature capricieuse et complexe des hommes.\n\nLorsque c'est arrivé, j'étais comme à mon habitude. J'ai tout d'abord\nentendu un sifflement insupportable venant des cieux, je me souviens\navoir porté mon regard de ce côté-ci et l'avoir vu. Noire comme la nuit\nla plus profonde, notre Némésis fendait droit sur nous. Je me souviens\nque ce qui me stupéfia le plus fut le calme qui s'abattit sur l'Atlantide.\nLa plupart des Kaïm cessèrent leurs jeux élémentaires et regardèrent cet\néclat satanien se précipiter sur eux. Il y en eut néanmoins qui trouvè-\nrent la force de libérer les hommes de leurs geôles ou celle de fuir au loin.\nPour ma part, alors que je contemplais Orichalka qui accouraient à notre\nrencontre, j'avais poursuivi, bien malgré moi, mon chemin. J'étais arrivé\nau cœur de notre cité. D'autres Kaïm se trouvaient là, attendant la fin.\nEt puis, il y eut de nouveau un insupportable sifflement. Mais celui-ci\nvenait de l'endroit où je me trouvais. La pyramide qui trônait au cœur\nd'Atlantys venait de se fracturer, libérant un souffle puissant qui emporta\ndans un océan de souffrance bon nombre des Kaïm qui se trouvaient là.\nJe sais aujourd'hui qu'ils y moururent.\n\nEn compagnie de quelques autres, je regardais cette Pierre disparaître\ndans les courants solaires qui fragmentaient notre cité, les propulsant\ndans les méandres chaotiques de cet océan fantomatique. Je me souviens\nque je la regardais intensément.\n\nPuis, je ressentis le besoin de la suivre, de me fondre dans son aveu-\nglante clarté. Et cela me sauva.\n\nLa chose dont je me souviens ensuite est d'avoir ouvert les yeux sur\nune plaine stérile où des Kaïm devenaient des Nephilim. Ils fuyaient\ndevant des meutes d'hommes ivres de colère et assoiffés de vengeance.\nDepuis ce jour, mon corps est celui d'un homme. Je n'ai pas de Méta-\nmorphe.\n\nIl m'arrive parfois d'oublier des siècles entiers ce que je suis, mais je\nme « réveille » toujours. L'époque est différente mais je me souviens de\ntout ce que je fis pendant l'absence de ma conscience occulte, lorsque je\nne suis, en quelque sorte, qu'un homme.\n\nNe me demandez pas pourquoi cela m'est arrivé? Pourquoi moi? Je\nl'ignore. Par contre, je sais que ma mission ne fait que commencer. Elle\nme l'a dit. Elle? L'Ig peut-être. Enfin je me plais à l'imaginer mais c'est\npeut-être cette Pierre ou même le Cosmos. Qui sait?\n\nPardonnez-moi mais je n'ai plus beaucoup de temps. Je sais que je dois\nvous guider dans les Guerres de l'Apocalypse pour qu'ensemble nous bâti-\nssions l'avenir. Mais ne vous méprenez pas. Bien que je connaisse les ques-\ntions que nous devons nous poser, je ne possède pas les réponses. Et je ne\nles chercherai pas. C'est à vous de les trouver, et ainsi, vous me rejoind-\nrez.\n\nAlors, vous serez Agarthéen. Comme moi.\n\n96\n", "status": "ok", "seconds": 48.74, "cer": 0.015740215541690302, "wer": 0.04995693367786391, "accent_edits": 5, "inserted_words": 0, "deleted_words": 1, "omitted_blocks": 0, "diff": "Mes <del>Frères, le<\/del> <ins>frères, Le<\/ins> temps est venu pour moi de taire les mensonges dont je vous abreuve depuis tant <del>d&#x27;année.<\/del> <ins>d&#x27;années.<\/ins> Il est temps en effet de vous révéler la vérité. Mais auparavant, quelques détails restés dans l&#x27;ombre doivent être mis en pleine lumière. Je ne suis pas mort. Enfin, pas au sens où vous l&#x27;entendez. À la fin de l&#x27;année <del>1998,<\/del> <ins>1948,<\/ins> j&#x27;ai dû <del>travestir<\/del> <ins>traverser<\/ins> avec <del>mes sorts<\/del> <ins>ma voiture<\/ins> le corps d&#x27;un malheureux clochard, un innocent, afin que nos ennemis découvrent dans mon bureau <del>sa<\/del> <ins>la<\/ins> dépouille carbonisée par le terrible feu que les hommes de <del>Tubalcaan<\/del> <ins>Tubalcaïn<\/ins> libérèrent dans ma demeure. Ne vous inquiétez pas; je m&#x27;attendais à leur visite, et j&#x27;avais quelques semaines plus tôt vidé ma bibliothèque de ses livres anciens et de ses trésors occultes. L&#x27;homme dont le corps fut découvert par les serviteurs du Bâton me dépassait de quelques centimètres, mais comme il se tenait souvent voûté, sa colonne vertébrale était <del>arcboutée,<\/del> <ins>accoutée,<\/ins> et ils furent trompés par ma mascarade. <del>Heureusement...<\/del> <ins>Heureusement.<\/ins> Ce soirlà, je n&#x27;étais pas très loin; je m&#x27;étais dissimulé <del>derrières<\/del> <ins>derrière<\/ins> un rempart de <del>buissons<\/del> <ins>buisson<\/ins> et d&#x27;arbustes de ma propriété, et je les ai entendus se féliciter. Ils avaient traqué, débusqué et tué SaintAmand, l&#x27;insaisissable, celui qui avait trahi son ancêtre. Évidemment, ils regrettaient de n&#x27;avoir récupéré que quelques notes à propos d&#x27;une <del>Frat  terrible feu que les hommes de Tubalcaan\nlibérèrent dans ma demeure. Ne vous inquiétez pas ; je m’attendais à leur\nvisite, et j’avais quelques semaines plus tôt vidé ma bibliothèque de ses\nlivres anciens et de ses trésors occultes.\n\nL’homme dont le corps fut découvert par les serviteurs du Bâton me\ndépassait de quelques centimètres, mais comme il se tenait souvent voûté,\nsa colonne vertébrale était arc-boutée, et ils furent trompés par ma mas-\ncarade. Heureusement…\n\nCe soir-là, je n’étais pas très loin ; je m’étais dissimulé derrières un\nrempart de buissons et d’arbustes de ma propriété, et je les ai entendus se\nféliciter. Ils avaient traqué, débusqué et tué Saint-Amand, l’insaisissable,\ncelui qui avait trahi son ancêtre. Évidemment, ils regrettaient de n’avoir\nrécupéré que quelques notes à propos d’une Fraternité de Déchus, et de ne\npas pouvoir percer mon mystère.\n\nDès qu’ils eurent quitté les lieux, chassés par les sirènes des forces de\nl’ordre et des premiers secours, je fuyais à mon tour les flammes qui léchaient\nles cieux, ne laissant derrière moi que des cendres. Je me rendis ensuite\ndans mon sanctuaire où j’attendis que les héritiers d’Épiméthée n’endor-\nsent leur lourde responsabilité et mènent leur combat jusqu’au bout.\nAujourd’hui, je peux l’avouer, je ne fus pas étranger à l’intervention de\nce fou de Pélican, à Lyon, en février 1999. Mais cette petite trahison était\nnécessaire. Et puis, elle est de l’histoire ancienne.\n\nPourquoi ai-je travesti ma propre mort ?, vous demandez-vous. Pour\nne pas gêner le Kwisatz Haderach et ses héritiers, pour ne pas empêcher leur\ndestinée de s’accomplir,… Pour que l’Apocalypse ait lieu. Si vous m’aviez\ncru parmi vous, vous auriez été tenté de me rendre visite, de me deman-\nder conseil ; et là vous auriez compris que j’en sais bien plus que je ne le\nlaisse croire depuis tant d’année, peut-être même m’auriez-vous percé à\njour et aujourd’hui vous le regretteriez.\n\nOui. Je savais que l’Apocalypse aurait lieu. J’en connaissais la nature\ndepuis la nuit des temps. Mais je sais également, depuis toujours, que ma\nprésence aurait pu tout faire rater. Si vous m’aviez cru en vie, rien n’au-\nrait fonctionné : le Monde serait tel que vous l’avez connu, les Sauriens\nse terreraient encore, et le 666 agirait toujours dans l’ombre de l’Histoire\nInvisible. Ma disparition et mon silence étaient nécessaires.\n\nVous perdez patience ?\n\nBien. Laissons alors à l’année 1999 ses événements, et parlons plutôt\nde moi, de ce que je suis et de ce que j’ai à vous transmettre. Soulevez le\nvoile d’Isis, pénétrez dans mon sanctuaire, laissez l’odeur fauve de mon\ncorps vous étourdir et troublez vos sens, et maintenant que vous êtes ivre,\ncontemplez ma véritable nature.\n\nJe suis celui que les Couronnés nomme Le Sphinx, L’Énigme. Je suis\nl’unique Kaïm qui trouva l’Agartha avant que la Chute n’ait dispersé\nnotre mémoire.\n\nNe soyez pas si surpris. Vous deviez vous douter que je n’étais pas\ncomme tous les hommes. Attendez. Ne vous emportez pas. Il faut me croire.\nÉcoutez mon histoire.\n\nAlors que les Champs magiques n’étaient pas encore souillés par l’Ori-\nchalque, tout comme vous, j’étais préoccupé par le Sentier d’Or. Chacun\nde mes Cycles basaltiques n’était qu’un prétexte de plus pour percer les\nmystères du Graal Primordial et des flux élémentaires qui le baignent\nsans cesse. Lorsque que les Ka-éléments de mon Pentacle ne se mêlaient\npas aux Champs magiques, j’étudiais les hommes. Comme vous, leur Ka-\nSoleil m’obsédait, je cherchais à comprendre. Tous les moyens étaient\nbons, seul comptait le résultat. Or, rien de très concluant ne se dégageait\nde mes recherches. Après chaque nouvel échec, je déambulais dans l’archi-\ntecture insensée d’Atantys. Peut-être espérais-je découvrir dans ces errances\nles secrets de l’Éther solaire ; peut-être croyais-je alors qu’elles me livre-\nraient la clef de la nature capricieuse et complexe des hommes.\n\nLorsque c’est arrivé, j’errais comme a mon habitude. J’ai tout d’abord\nentendu un sifflement insupportable venant des cieux, je me souviens\navoir porté mon regard de ce côté-ci et l’avoir vu. Noire comme la nuit\nla plus profonde, notre Némésis fonçait droit sur nous. Je me souviens\nque ce qui me stupéfia le plus fut le calme qui s’abattit sur l’Atlantide.\nLa plupart des Kaïm cessèrent leurs jeux élémentaires et regardèrent cet\néclat saturnien se précipiter sur eux. Il y en eut néanmoins qui trouvè-\nrent la force de libérer les hommes de leurs geôles ou celle de fuir au loin.\nPour ma part, alors que je contemplais Orichalka qui accouraient à notre\nrencontre, j’avais poursuivit, bien malgré moi, mon chemin. J’étais arrivé\nau cœur de notre cité. D’autres Kaïm se trouvaient là, attendant la fin.\nEt puis, il y eut de nouveau un insupportable sifflement. Mais celui-ci\nvenait de l’endroit où je me trouvais. La pyramide qui trônait au cœur\nd’Atlantys venait de se fracturer, libérant un souffle puissant qui emporta\ndans un océan de souffrance bon nombre des Kaïm qui se trouvaient là.\nJe sais aujourd’hui qu’ils s’y noyèrent.\n\nEn compagnie de quelques autres, je regardais cette Pierre disparaître\ndans les courants solaires qui fragmentaient notre cité, les propulsant\ndans les méandres chaotiques de cet océan fantomatique. Je me souviens\nque je la regardais intensément.\n\nPuis, je ressentis le besoin de la suivre, de me fondre dans son aveu-\nglante clarté. Et cela me sauva.\n\nLa chose dont je me souviens ensuite est d’avoir ouvert les yeux sur\nune plaine stérile où des Kaïm devenaient des Nephilim. Ils fuyaient\ndevant des meutes d’hommes ivres de colère et assoiffés de vengeance.\n\nDepuis ce jour, mon corps est celui d’un homme. Je n’ai pas de Méta-\nmorphe.\n\nIl m’arrive parfois d’oublier des siècles entiers ce que je suis, mais je\nme « réveille » toujours. L’époque est différente mais je me souviens de\ntout ce que je fis pendant l’absence de ma conscience occulte, lorsque je\nne suis, en quelque sorte, qu’un homme.\n\nNe me demandez pas pourquoi cela m’est arrivé ? Pourquoi moi ? Je\nl’ignore. Par contre, je sais que ma mission ne fait que commencer. Elle\nme l’a dis. Elle ? L’Iz peut-être. Enfin je me plais à l’imaginer mais c’est\npeut-être cette Pierre ou même le Cosmos. Qui sait ?\n\nPardonnez-moi mais je n’ai plus beaucoup de temps. Je sais que je dois\nvous guider dans les Guerres de l’Apocalypse pour qu’ensemble nous bâtis-\nsions l’avenir. Mais ne vous méprenez pas. Bien que je connaisse les ques-\ntions que nous devrons nous poser, je ne possède pas les réponses. Et je ne\nles chercherais pas. C’est à vous de les trouver, et ainsi, vous me rejoin-\ndrez.\n\nAlors, vous serez Agarthien. Comme moi.\n\nA\n", "furniture": ["Les confidences du Duc de Saint-Amand", "96"]}, {"id": "olmocr-old_scans-1", "set": "olmocr", "group": "old_scans", "image": "../inputs/images/olmocr-old_scans-1.llm.png", "full_image": "../inputs/images/olmocr-old_scans-1.png", "engines": {"marker2": {"raw": "MAY 28 ARST\n\n31.\n\nBangor Pa. May 22<sup>nd<\/sup> 1914.  \nCol. Rosevelt & Comrade & Friend\n\nI am one of D. E. Sickles old  \nRegt & Brigade I served through  \nall of the civil War. During the  \n5. years was with Gen Sickles  \nwhen He lost His log. then He  \nleft us. I regret you & assure from  \nthis country During your trip to  \nS. A. I saw me Pfnchott Here &  \nHad a solite talk with Him about  \nyou & the Political Situation of the  \ncountry I am with you for the  \nElection of Eifford Pfnchott as U.S.  \nSenitor. one loaw Here must Be  \nRepealed as we are Defined of  \nVoting for whoever we desire at  \nthe Primaries. if you come to Easton  \nor Bangor Pa I would site to  \nSee you Address 25 market St Bangor  \nYours very Resp. Caleb Ahen\n", "status": "ok", "seconds": 8.8, "passed": 1, "tests": 5, "results": [{"type": "order", "passed": false, "explanation": "'before' text 'Sickles old Regt & Brigade I served thro...' not foun ment interest expense limitation.\n\n### High-Taxed Income\n\nIn some cases, passive income may be placed in the general limitation income category. Passive income may qualify as general limitation income if the foreign taxes you paid on the income (after allocation of expenses) exceed the highest U.S. tax that can be imposed on the income.\n\n## Specific Instructions\n\n### Part I—Taxable Income or Loss From Sources Outside the United States\n\n#### Line 1\n\nInclude any income in the category checked above Part I that is taxable by the United States and that is from sources within the country entered on line j. You must include this income\n\neven if it is not taxable by that country. Identify the type of income on the dotted line next to line 1. Do not include any earned income excluded on Form 2555, Foreign Earned Income. Use a separate Form 1116 for each category of income you are reporting.\n\n**Example.** If you received dividends (passive income) and wages (general limitation income) from a foreign source, you must complete two Forms 1116. On one Form 1116, enter the dividends on line 1 and write “Dividends” on the dotted line. On the other Form 1116, enter wages (not excluded on Form 2555) on line 1 and write “Wages” on the dotted line. Complete Parts I, II and III of each Form 1116. Then, complete the summary Part IV of one Form 1116.\n\n**Note:** If you are reporting income from a partnership or an S corporation, include on line 1 any amount from line 17c, Schedule K-1 (Form 1065) or from line 15c, Schedule K-1 (Form 1120S).\n\n### Allocating Deductions\n\nYou must reduce your foreign gross income on line 1 by entering on lines 2 through 5:\n\n●\\*Any deductions you are taking that directly relate to that foreign income AND\n\n●\\*A ratable share of your other deductions that do not directly relate to either your foreign income on line 1 or your U.S. source income.\n\nDo not include deductions and losses related to exempt or excluded income such as foreig ocr-multi_column-01566a951fd40f8c1a4b8190cc3d0f93c393_page_4_pg1.png", "engines": {"marker2": {"raw": "fiscal year limitation. Such fees shall be collected in each fiscal year in an amount equal to the amount specified in appropriations Acts for such fiscal year and shall only be collected and available for the costs of the Food and Drug Administration.\n\n(C) For purposes of this paragraph, a certification by the Secretary shall be made on such basis, and in such form (including a publicly available listing) as the Secretary determines appropriate.\n\n(D) With regard to fees pursuant to subparagraph (B) in connection with written export certifications for food:\n\n(i) Such fees shall be collected and available solely for the costs of the Food and Drug Administration associated with issuing such certifications.\n\n(ii) Such fees may not be retained in an amount that exceeds such costs for the respective fiscal year.\n\n#### **(f) Labeling of exported drugs**\n\n(1) If a drug (other than insulin, an antibiotic drug, an animal drug, or a drug exported under section 382 of this title) being exported in accordance with subsection (e) of this section is being exported to a country that has different or additional labeling requirements or conditions for use and such country requires the drug to be labeled in accordance with those requirements or uses, such drug may be labeled in accordance with such requirements and conditions for use in the country to which such drug is being exported if it also is labeled in accordance with the requirements of this chapter.\n\n(2) If, pursuant to paragraph (1), the labeling of an exported drug includes conditions for use that have not been approved under this chapter, the labeling must state that such conditions for use have not been approved under this chapter. A drug exported under section 382 of this title is exempt from this section.\n\n#### **(g) Warning notice of importation in violation of chapter**\n\n(1) With respect to a prescription drug being imported or offered for import into the United States, the Secretary, in the case of an individual who is not in the business of such importations, may not send a warning notice to the individual unless the following conditions are met:\n\n(A) The notice specifies, as applicable to the importation of the drug, that the Secretary has made a determination that—\n\n(i) importation is in violation of subsection (a) of this section because the drug is or appears to be adulterated, misbranded, or in violation of section 355 of this title;\n\n(ii) importation is in violation of subsection (a) of this section because the drug is or appears to be forbidden or restricted in sale in the country in which it was produced or from which it was exported;\n\n(iii) importation is or appears to be in violation of subsection (d)(1) of this section; or  \n(iv) importation otherwise is or appears to be in violation of Federal law.\n\n(B) The notice does not specify any provision described in subparagraph (A) that is not applicable to the importation of the drug.\n\n(C) The notice states the reasons underlying such determination by the Secretary, including a brief application to the principal facts involved of the provision of law described in subparagraph (A) that is the basis of the determination by the Secretary.\n\n(2) For purposes of this section, the term “warning notice”, with respect to the importation of a drug, means a communication from the Secretary (written or otherwise) notifying a person, or clearly suggesting to the person, that importing the drug for personal use is, or appears to be, a violation of this chapter.\n\n#### **(h) Protection against adulteration of food**\n\n(1) The Secretary shall give high priority to increasing the number of inspections under this section for the purpose of enabling the Secretary to inspect food offered for import at ports of entry into the United States, with the greatest priority given to inspections to detect the intentional adulteration of food.\n\n(2) The Secretary shall give high priority to making necessary improvements to the information management systems of the Food and Drug Administration that contain information related to foods imported or offered for import into the United States for purposes of improving the ability of the Secretary to allocate resources, detect the intentional adulteration of food, and facilitate the importation of food that is in compliance with this chapter.\n\n(3) The Secretary shall improve linkages with other regulatory agencies of the Federal Government that share responsibility for food safety, and shall with respect to such safety improve linkages with the States and Indian tribes (as defined in section 450b(e) of title 25).\n\n#### **(i) Testing for rapid detection of adulteration of food**\n\n(1) For use in inspections of food under this section, the Secretary shall provide for research on the development of tests and sampling methodologies—\n\n(A) whose purpose is to test food in order to rapidly detect the adulteration of the food, with the greatest priority given to detect the intentional adulteration of food; and\n\n(B) whose results offer significant improvements over the available technology in terms of accuracy, timing, or costs.\n\n(2) In providing for research under paragraph (1), the Secretary shall give priority to conducting research on the development of tests that are suitable for inspections of food at ports of entry into the United States.\n\n(3) In providing for research under paragraph (1), the Secretary shall as appropriate coordinate with the Director of the Centers for Disease Control and Prevention, the Director of the National Institutes of Health, the Administrator of the Environmental Protection Agency, and the Secretary of Agriculture.\n\n(4) The Secretary shall annually submit to the Committee on Energy and Commerce of the House of Representatives, and the Committee on Health, Education, Labor, and Pensions of th ren gewandelt. Die Kohlepreise auf dem Weltmarkt steigen unablässig.\n\nMit der Substitution von Kohle durch Kunststoffe, um den darin enthaltenen Kohlenstoff nicht nur energetisch, sondern stofflich für neue Produkte zu verwerten, hat die AlzChem jetzt weltweit ein Alleinstellungsmerkmal.\n\nDie abfallpolitische Einordnung wurde von Herrn Dr. h. c. Karl J. Thomé-Kozmiensky auf der Berliner Energiekonferenz 2011 wie folgt beschrieben: „Auch aus umweltpolitischer Sicht ist es vorteilhaft, dass der im Kunststoff enthaltene Kohlenstoff nicht energetisch sondern rohstofflich verwertet wird. Damit ist das Verfahren in der Prioritätenfolge der Abfallrahmenrichtlinie höher einzuordnen als die Verbrennung der Altkunststoffe als Ersatzbrennstoffe.“\n\nIn einem neuen Projekt will das Unternehmen auch für das in PVC enthaltene Chlor eine stoffliche Verwertung ermöglichen. „Um dieses Ziel zu erreichen, nutzen wir eine altbekannte Eigenschaft von PVC, nämlich bei Temperaturen oberhalb von ca. 250 °C Chlorwasserstoff abzuspalten“, erläutert Dr. Hans-Hermann Niemeyer, der das Projekt leitet. „Parallel dazu erhält man einen kohlenstoffreichen „PVC-Koks“, der dann die konventionellen Schwarzstoffe für die Carbid-Herstellung in Zukunft teilweise ersetzen soll.“ Der „PVC-Koks“ soll natürlich im Carbid-Verfahren auf Herz und Nieren getestet werden. Dazu wird ein Versuchsofen gebaut, der sogenannte Technikums-Carbid-Ofen.\n\n## Projektorganisation\n\nBundesministerium für Wirtschaft und Technologie (BMWi)  \n11019 Berlin\n\nProjektträger Jülich  \nForschungszentrum Jülich GmbH  \nDr. Michael Gahr  \n52425 Jülich\n\n[Förderkennzeichen](#)  \n0327409A\n\n## Impressum\n\n**ISSN**  \n0937 - 8367\n\n[Herausgeber](#)  \nFIZ Karlsruhe GmbH · Leibniz-Institut  \nfür Informationsinfrastruktur  \nHermann-von-Helmholtz-Platz 1  \n76344 Eggenstein-Leopoldshafen\n\n[Autor](#)  \nDr. Franz Meyer\n\n[Titelbild](#)  \nAlzChem Trostberg GmbH\n\n[Urheberrecht](#)  \nEine Verwendung von Text und Abbildung gan (profit oriented) sebagai sumber pendapatan sebanyak 9 orang (13.3%). Dengan demikian dapat dikatakan bahwa sebagian besar responden tidak setuju bila pemerintah mengembangkan usaha mencari keuntungan sebagai sumber pendapatan dan hanya sebagian kecil yang setuju untuk hal ini.\n\nDari hasil wawancara penulis dengan beberapa pejabat dan observasi dilapangan menunjukkan bahwa pemerintah tidak bisa disamakan dengan pihak swasta karena misinya berbeda dengan pemerintah, selanjutnya aparat pemerintah banyak yang tidak mempunyai kemampuan wirausaha dan terakhir banyak usaha-usaha yang dijalankan pemerintah rugi, kebocoran dimana-dimana, ditambah lagi efisiensi jauh dari yang diharapkan seperti perusahaan-perusahaan milik pemerintah baik dipusat maupun didaerah. Hal ini terungkap dari beberapa hasil wawancara dengan M. Mahyuddin M, ST, M.Si Kasubag Prasarana Fisik Pemerintahan di Sekretariat Daerah Kabupaten Buton berikut ini:\n\n\"Menurut saya memang sudah saatnya pemerintah berpikir untuk mencari sumber pendapatan baru, apalagi dengan otonomi daerah ini mau tidak mau suka tidak suka kalau mau jalan suatu pemerintah daerah ia harus punya sumber pendapatan yang besar.kita dibengkalis terbantu oleh dana perimbangan minyak jika ini tidak ada, kitapun sama tahu bengkalis menjadi hanyut\n\nbila kita tidak punya pemikiran mencari sumber pendapatan alternatif selain dana perimbangan.\" (Hasil wawancara penulis, 6 September 2013).\n\nBegitulah adanya pemahaman dan pengertian yang beragam dari setiap responden mengenai setiap pernyataan yang ada dengan alasan yang berbeda pula. Setiap orang punya alasan tersendiri untuk menjawab setuju ataupun tidak setuju. Itulah gambaran umum jawaban responden terhadap aspek *profit oriented* yang dikembangkan pemerintah dengan alasannya setuju dan ketidak setujuan mereka.\n\n### Persepsi Pejabat Birokrasi Pemerintah dalam Kewirausahaan.\n\nAspek Pengetahuan Dan Sikap Terhadap Kewirausahaan\n\nTabel IV.8. Aspek Pengetahuan dan Sikap Terhada rnw.*\n\n(4) One mode of curing the *lues venerea* was by the *tub*, the patient sweating for a considerable time in a heated tub. This mode is often alluded to by early writers.\n\nTUBBAN. A clod of earth. *Cornw.*\n\nTUBBER. A cooper. *North.*\n\nTUBBLE. A mattock. *Devon.*\n\nTUB-IRON. An iron placed in front of a smith's fire-place, having a hole through which the spout of the bellows is put.\n\nTUBLE. Earthenware. *West.*\n\nTU-BRUGGE. A drawbridge.\n\nTUCK. (1) To eat. Also, an appetite.\n\n(2) A short pinafore. *East.*\n\n(3) To smart with pain. *Wilts.* In Devonshire, to pinch severely.\n\n(4) A slap. *Devon.*\n\n(5) A horizontal fold made in a garment to accommodate it to the height of a growing person.\n\n(6) To touch. *Somerset.*\n\n(7) A rapier. Still in use.\n\n(8) To chuck. *Cornw.*\n\nTUCKER. (1) A fuller. *West.*\n\n(2) The same as *Pinner*, q. v.\n\nTUCKER-IN. A chambermaid. *West.*\n\nTUCKET. A slight flourish on a trumpet.\n\nTUCKING. A bag used for carrying beans in when setting them. *Glouc.*\n\nTUCKING-GIRDLE. \"Tuckyng kyrdell, *sainc-ture decourser*,\" Palsgrave.\n\nTUCKS. Iron pins in the frame of a timber-tug to prevent the timber slipping off.\n\nTUCKSHELLS. Tusks. *Sussex.*\n\nTUE. (1) To rumple. *North.*\n\n(2) The same as *Tew*, q. v.\n\nTUEL. (1) A towel. *West.*\n\n(2) The fundament. See *Tewel*.\n\n(3) A vexatious meddling. *North.*\n\nTUEN. To go.  \nAnt alle the other that mine buen,  \nShule to blisse with me *tuen*.\n\n*Harrowing of Hell*, p. 29.\n\nTUFF. (1) A Turkish turban.\n\n(2) A tassel. Also, to ornament with tassels.\n\n(3) A lock of wool.\n\n(4) To spit or hiss, as a cat.\n\nTUFFOLD. A small outhouse. *Yorksh.*\n\nTUFT: A grove, or plantation.\n\nTUFT-HUNTER. A hanger-on to noblemen and persons of quality.\n\nTUFT-MOCKADO. A mixed stuff-made to imitate tufted taffeta, or velvet.\n\nTUFT-TAFFATY. A taffaty tufted, or left with a nap on it, like velvet.  \nSleeveless his jerkin was, and it had been Velvet, but 'twas now (s ion's labours (iii. 9). To Malachi the reason of this is plain. The \"law of Moses\" was forgotten (iv. 4 [iii. 22]); let the people return to Yahweh, and He will return to them. It was in vain to complain, saying, \"Every one that doeth evil is good in the eyes of Yahweh,\" or \"Where is the God of judgment?\"—vain to ask \"Wherein shall we return?\" Obedience to the law is the sure path to blessing (ii. 17-iii. 12).\n\nHe calls the people to repentance, and he enforces the call by proclaiming the approach of Yahweh in judgment against the sorcerers, the adulterers, the false swearers, the oppressors of the poor, the orphan and the stranger. Then it shall be seen that He is indeed a God of righteous judgment, distinguishing between those that serve Him and those that serve Him not. The Sun of Righteousness shall shine forth on those that fear Yahweh's name; they shall go forth with joy, and tread the wicked under foot. The conception of the day of final decision, when Yahweh shall come suddenly to His temple (iii. 1) and confound those who think the presumptuous godless happy (iii. 15), is taken from earlier prophets, but is applied wholly within the Jewish nation. The day of Yahweh would be a curse, not a blessing, if it found the nation in its present state: the priests listlessly performing a fraudulent service (i. 7-ii. 9), the people bound by marriage to heathen women, while the tears of the daughters of Israel, thrust aside to make way for strangers, cover the altar (ii. 11-16), all faith in divine justice gone (ii. 17; iii. 14 seq.), sorcery, uncleanness, falsehood and oppression rampant (iii. 5), the house of God deprived of its dues (iii. 8), and the true fearers of God a little flock gathered together in private exercises of religion (perhaps the germ of the later synagogue) in the midst of a godless nation (iii. 16). That the day of Yahweh is delayed in such a state of things is but a new proof of His unchanging love (iii. 6), which refuses to consume the sons of Jacob. Meantime He is about to send His messenger to prepare His way before Him. The prophet Elijah must reappear to bring back the hearts of fathers and children before the great and terrible day of Yahweh come. Elijah was the advocate of national decision in the great concerns of Israel's religion; and it is such decision, a clear recognition of what the service of Yahweh means, a purging of His professed worshippers from hypocritical and half-hearted service (iii. 3) that Malachi with his intense religious earnestness sees to be the only salvation of the nation. In thus looking to the return of the ancient prophet to do the work for which later prophecy is too weak, Malachi unconsciously signalizes the decay of the order of which he was one of the last representatives; and the somewhat mechanical measure which he applies to the people's sins, as for example when he teaches that if the sacred dues were rightly paid prosperous seasons would at once return (iii. 10), heralds the advent of that system of formal legalism which thought that all religious duty could be reduced to a system of set rules. Yet Malachi himself is no mere formalist. To him, as to the Deuteronomic legislation, the forms of legal observance are of value only as the fitting expression of Israel's peculiar sonship and service, and he shows himself a true prophet when he contrasts the worthless ministry of unwilling priests with the pure offering of prayer and praise that rises from the implicit monotheism of even Gentile worship<sup>2<\/sup> (i. 11), or when he asserts\n\nthe brotherhood of all Israelites under their one Father (ii. 10), not merely as a ground of separation from the heathen, but as inconsistent with the selfish and cruel freedom of divorce current in his time.<sup>3<\/sup> The book is a significant landmark in the religious history of Israel. Its emphasis on the observance of ritual finds fullest development in the Priestly Code, subsequently promulgated; its protest against foreign marriages is made effective through the reforms of Ezra and Nehemiah;<sup>4<\/sup> the influence of its closing words on later expectation is familiar to every reader of the new Testament.<sup>5<\/sup>\n\nThe style of Malachi, like his argument, corresponds in its generally prosaic character to that transformation or decay of prophecy which began with Ezekiel; and Ewald rightly called attention to the fact that the conduct of the argument already shows traces of the dialectic manner of the schools. Yet there is a simple dignity in the manner not unworthy of a prophet, and rising from time to time to poetical rhythm.\n\nLITERATURE.—Nowack, *Die kleinen Propheten* (1897; 2nd ed., 1904); Wellhausen, id. (iii. 1898); G. A. Smith, *The Book of the Twelve* (ii. 1898); A. C. Welch, art. \"Malachi\" in Hastings's *Dict. of the Bible*, iii. 218-222 (1900); C. C. Torrey, id. in *Ency. Bib.* iii. c. 2907-2910 (1902); Marti, *Dodekapropheton* (1904); Stade, *Biblische Theologie des Alten Test.* § 141 (1905); Driver, *The Minor Prophets*, ii. (Century Bible, 1906). (W. R. S.; H. W. R.\\*)\n\nMALACHITE, a copper-ore of fine green colour, sometimes polished as an ornamental stone. The name is derived from Gr. *μαλάχη*, the mallow; in allusion to the colour of the mineral being rather like that of the mallow-leaf. Malachite was perhaps one of the green minerals described by Theophrastus under the general name of *σμάραγδος*; and according to the late Rev. C. W. King it was probably the *smaragdus medicus* of Pliny, whilst his *molochites* seems to have been a different stone from our malachite and may have been a green jasper. It is suggested by J. L. Myres (*Ency. Bib.*) that malachite may have been the Heb. *soham*, of the high priest's breastplate.\n\nMalachite is a basic cupric carbonate, represented by the formula  $\\text{CuCO}_3\\text{Cu}(\\text{HO})_2$ , and has usually been formed by the action of meteoric agencies on other copper-minerals; hence it is found in the upper part of ore-deposits, often as an incrustation, and occasionally as a pseudomorph after cuprite, chalcocite, &c. When formed, as commonly happens, by the alteration of copper-pyrites the iron of this mineral usually takes the form of limonite, which may remain associated with the malachite. Occasionally, though but rarely, malachite occurs in small dark-green prismatic crystals of the monoclinic system. Its usual mode of occurrence is in nodular or stalagmitic forms, with a mammillated, reniform or botryoidal surface, whilst in other cases it forms fibrous, compact or even earthy masses. The nodules, though commonly dull on the outside, may display on fracture a beautiful zonary structure, the successive layers often succeeding each other as curved deposits of light and dark tints. The colours include various shades of apple-green, grass-green, emerald-green and verdigris-green. Certain varieties exhibit a finely fibrous structure, producing on the fractured surface a soft silky sheen.\n\nWhilst malachite is found in greater or less quantity in most copper-mines, the finer varieties useful for ornamental purposes are of very limited occurrence, and the lapidary has generally drawn his supply from Russia and Australia. The principal source in recent years has been the Medno-Rudiansk mine near Nizhne Tagilsk, on the Siberian side of the Urals, but it was formerly obtained from mines near Bogoslovsk to the north and Gumishev to the south of this locality. A mass from Gumishev, preserved in the museum of the Mining Institute of St Petersburg weighs 3240 lb, and still larger masses have been found near Nizhne Tagilsk. The mineral is prized in\n\n<sup>3<\/sup> In ii. 16 the Targum renders \"If thou hatest her put her away.\" It is characteristic of later Judaism that an arbitrary exegesis transformed the above anticipation of the doctrine of marriage laid down in the gospel into an express sanction of the right of the husband to put away his wife at will.\n\n When formed, as commonly happens, by the alteration of copper-pyrites the iron of this mineral usually takes the form of limonite, which may remain associated with the malachite. Occasionally, though but rarely, malachite occurs in small dark-green prismatic crystals of the monoclinic system. Its usual mode of occurrence is in nodular or stalagmitic forms, with a mammillated, reniform or botryoidal surface, whilst in other cases it forms fibrous, compact or even earthy masses. The nodules, though commonly dull on the outside, may display on fracture a beautiful zonary structure, the successive layers often succeeding each other as curved deposits of light and dark tints. The colours include various shades of apple-green, grass-green, emerald-green and verdigris-green. Certain varieties exhibit a finely fibrous structure, producing on the fractured surface a soft silky sheen.\n\nWhilst malachite is found in greater or less quantity in most copper-mines, the finer varieties useful for ornamental purposes are of very limited occurrence, and the lapidary has generally drawn his supply from Russia and Australia. The principal source in recent years has been the Medno-Rudiansk mine near Nizhne Tagilsk, on the Siberian side of the Urals, but it was formerly obtained from mines near Bogoslovsk to the north and Gumishev to the south of this locality. A mass from Gumishev, preserved in the museum of the Mining Institute of St Petersburg weighs 3240 lb, and still larger masses have been found near Nizhne Tagilsk. The mineral is prized in\n\n<sup>3<\/sup> In ii. 16 the Targum renders \"If thou hatest her put her away.\" It is characteristic of later Judaism that an arbitrary exegesis transformed the above anticipation of the doctrine of marriage laid down in the gospel into an express sanction of the right of the husband to put away his wife at will.\n\n<sup>4<\/sup> \"The permanence of Judaism depended on the religious separateness of the Jews\" (Ryle, *Ezra and Nehemiah*, p. es of Yahweh,\" or \"Where is the God of judgment?\"—vain to ask \"Wherein shall we return?\" Obedience to the law is the sure path to blessing (ii. 17-iii. 12).\n\nHe calls the people to repentance, and he enforces the call by proclaiming the approach of Yahweh in judgment against the sorcerers, the adulterers, the false swearers, the oppressors of the poor, the orphan and the stranger. Then it shall be seen that He is indeed a God of righteous judgment, distinguishing between those that serve Him and those that serve Him not. The Sun of Righteousness shall shine forth on those that fear Yahweh's name; they shall go forth with joy, and tread the wicked under foot. The conception of the day of final decision, when Yahweh shall come suddenly to His temple (iii. 1) and confound those who think the presumptuous godless happy (iii. 15), is taken from earlier prophets, but is applied wholly within the Jewish nation. The day of Yahweh would be a curse, not a blessing, if it found the nation in its present state: the priests listlessly performing a fraudulent service (i. 7–ii. 9), the people bound by marriage to heathen women, while the tears of the daughters of Israel, thrust aside to make way for strangers, cover the altar (ii. 11–16), all faith in divine justice gone (ii. 17; iii. 14 seq.), sorcery, uncleanness, falsehood and oppression rampant (iii. 5), the house of God deprived of its dues (iii. 8), and the true fearers of God a little flock gathered together in private exercises of religion (perhaps the germ of the later synagogue) in the midst of a godless nation (iii. 16). That the day of Yahweh is delayed in such a state of things is but a new proof of His unchanging love (iii. 6), which refuses to consume the sons of Jacob. Meantime He is about to send His messenger to prepare His way before Him. The prophet Elijah must reappear to bring back the hearts of fathers and children before the great and terrible day of Yahweh come. Elijah was the advocate of national d assed": true, "explanation": ""}, {"type": "present", "passed": true, "explanation": ""}, {"type": "present", "passed": true, "explanation": ""}, {"type": "present", "passed": true, "explanation": ""}, {"type": "present", "passed": true, "explanation": ""}, {"type": "present", "passed": true, "explanation": ""}, {"type": "present", "passed": true, "explanation": ""}, {"type": "present", "passed": true, "explanation": ""}, {"type": "present", "passed": true, "explanation": ""}]}}}, {"id": "olmocr-long_tiny_text-17_pg17_pg1", "set": "olmocr", "group": "long_tiny_text", "image": "../inputs/images/olmocr-long_tiny_text-17_pg17_pg1.llm.png", "full_image": "../inputs/images/olmocr-long_tiny_text-17_pg17_pg1.png", "engines": {"marker2": {"raw": "impartially dealt with, we had no just claim against the Nizam.\" In '1853,' he repeats 'we had little or no claim against the Nizam.'<sup>†<\/sup> In 1853 there was, in fact, a disputed balance-sheet. The balance of 430,000. which was demanded was made out by debiting the Nizam with cash payments from our Treasury for the Hyderabad Contingent, while refusing to credit him with sums due to him by our Government on other accounts. Interest, first at 12 and afterwards at 6 per cent., on all our advances, formed nearly a quarter of the claim. The principal of the Nizam's counter-claim, without any calculation of interest, was more than the whole charge against him. But no set-off, or inquiry as to a set-off, was tolerated by Lord Dalhousie's Administration; though subsequently, under Lord Canning's Government, the chief item—the *abkaree*, or excise collections of Secunderabad and Jaulnah—'was prospectively allowed to be a portion of the legitimate revenue of the Hyderabad State.'<sup>‡<\/sup>\n\nNo plea of set-off was listened to, and a distress was put in, embittered by terms of menace and insult. Lord Dalhousie, in the process of enforcing this most questionable pecuniary claim—most questionable even if the Nizam's large counter-claims were excluded—had written personally to the Nizam, telling him that the Hyderabad State was bound to maintain the Contingent 'by the stipulations of existing treaties;' reminding him that it was dangerous 'to provoke the resentment of the British Government,' 'whose power can crush you at its will,' and warning him that 'the independence of his sovereignty' stood in imminent danger.' In the same letter the Nizam was advised, as an indispensable measure of economy, to disband 'the Arab soldiery,' those 'turbulent mercenaries' who consumed so large a portion of his revenues, and to rouse himself to make a great effort for 'the early liquidation of the accumulated debt.' If the Nizam were unable to meet the call on his treasury, he must 'forthwith make over' to the British Government certain frontier districts of his territory enumerated in a schedule annexed to this letter.<sup>§§<\/sup>\n\nIt was a ready money question entirely. In 1851, when the unpleasant letter from which I have quoted was addressed to him, the Nizam stayed off the difficulty by paying a large sum on account. If he had produced the cash that was demanded in 1853, when similar pressure was applied, he would have avoided the sequestration of his districts. But his resources and his credit were exhausted, and the Governor-General would wait no longer. The Nizam's vain endeavours to gain time were cut short by an intimation that unless he at once consented to sign the new treaty, orders would be given for the advance of British troops, not merely into the districts that were wanted, but also into his capital. Then the Nizam and his advisers saw that he had before him the choice of signing the treaty.\n\nor being dethroned. They understood perfectly, if every one else was ignorant of it—which is not likely—that it must come to that. The Nizam's Government was not as strong in 1853, nor was Hyderabad as orderly, as they have become during the treaty years' administration of the Nawab Salar Jung. Without counting the armed men in a fortified city of 200,000 inhabitants, were almost every man was armed, Hyderabad was full of those turbulent mercenaries whom our Government, as they, of course, were well aware, was urging the Nizam to disband. They knew that military occupation meant not only the loss of their bread, but the loss of their hard-earned savings. For the Arab soldiery were the greatest money-lenders in Hyderabad, and after their expulsion by British power they would obviously have had great difficulty in collecting their little accounts. Their leaders would certainly have taken every advantage of Mussulman fanaticism and general excitement to have one last desparing struggle before they submitted to the loss of their homes, and of all that they possessed. Although the city could not have resisted a British force for six hours, it would not have been occupied without a contest. But the first shot fired from the walls, the first drop of blood shed, would in those days, so far as we can argue from the general tone and temper of Lord Dalhousie's administration, have cost the Nizam his throne. It would certainly have been worse than useless for him to plead that he could not control the unruly rabble of his capital. If, as might easily have been the case, a great number of the combatants had been proved to be in his own pay, his conduct would have been stigmatized as gross and infamous treachery. It would have gone hard with him.\n\nWe have seen Lord Dalhousie representing to the Nizam that the Hyderabad State was bound to maintain the Contingent 'by the stipulations of existing treaties,' and I have said that this representation was erroneous. That it was so I shall prove from Lord Dalhousie's own mouth, and this will afford a very striking illustration of the iniquitous manner in which the actual system of secret correspondence and consultation effects the weaker party. In 1851 the Governor-General insists that 'the efficient maintenance of the Force is , and, in all likelihood, in less agreeable, circumstances. Eminent as his services have been, and remarkable as his career has been, there are many thousands who ask, \"Who is Sir Salar Jung?\", And there are many thousands who have never heard of his name. It was a revelation to millions, indeed, to hear that there were still Native States in India with Courts, Ministers, and Armies of their own. We fear that there are some, even among the educated classes, who would be puzzled to give a very definite account of the Deccan, or to describe the territories of the Nizam, and the nature and relations of the State and its ruler with the British Government. Had the Deccan been involved in the troubles of 1857-8, as Gwalior and Indore were, we should, no doubt, have been acquainted with the particulars, but the services which were rendered to the British Government at that eventful period were of the utmost value and magnitude, although they, fortunately, did not need to be written in characters of blood. The Deccan extends over nearly 100,000 square miles, and is peopled by 10,000,000 inhabitants, of whom the vast majority—probably nine in ten—are Hindoos. The soil is generally good and produces cotton in abundance. Coal and iron mines have been discovered, and the great rivers Kistna, Tombudra, and Godavery drain the vast plateau which forms the bulk of the land and open it to the Eastern and Western Oceans. The first Nizam established friendly relations with the English Governor of Fort St. David in 1747, which were generally maintained in the wars with the French and their allies, and, although for a time the ability and genius of Bussy secured the ascendancy of his councils and influence at Hyderabad, the troops and resources of the Nizam were placed at our disposal in the campaign against Tippoo in 1791, and in the struggle with the Mahrattas, and the fliance has continued to the present day. In 1853 Sir Salar Jung was\n\nappointed to succeed his uncle, Suraj-ool-Moolk, as Dewan to Nasur-doo Dowlah, who had just been forced by Lord Dalhousie to assign to the superintendence of the British certain rich districts to secure the payment of debts alleged to be due for the pay of the Contingent which was kept up in accordance with the Treaty by the Dewan. He was only 19 years of age, and the condition of the State was one which might have appalled the boldest and most experienced of statesmen.\n\nThere was no money in the Treasury—the system of taxation was wasteful and unproductive. Although the Residents at the Court of Hyderabad had been for many years possessed of paramount power, they applied their energies to the sole object of securing British interests, and did not interfere in the internal affairs of the State with a view to their improvement. In fact, as long as the enormously expensive Contingent was paid, they cared little for the manner in which the money was raised. Armed bands, miscalled soldiery, carried terror and dismay through the country, and created, disturbances and riots in the towns at their pleasure. Hyderabad was a hot-bed of turbulent fanaticism. Arab mercenaries and Rohillas, ever ready for mischief, paralyzed the arm of law and order, blighted trade and commerce, and threatened at any moment to require the attention of the Governor-General, at that moment Lord Dalhousie, whose methods in such cases were terribly earnest. Salar Jung began his work by refusing to draw more than half the salary of his office, and his example was followed by the other servants of the State. He put an end to the system of forming the revenues; he discouraged the immigration of Arabs and Rohillas, and set to work to strengthen the hands of the police, and to obtain some degree of security for property and life. But while he was engaged in this Herculean task there came upon him a trial, the tension and force of which can never be understood by a European and a Christian. He was a Mahomedan, and he served a Mahomedan State. Th ad. It is likely to leave an indelible mark on the history of the relations between England and India. Had that tour never been undertaken Sir Salar Jung would, in all probability, have come to England; but he would have appeared among us in different, and, in all likelihood, in less agreeable, circumstances. Eminent as his services have been, and remarkable as his career has been, there are many thousands who ask, \"Who is Sir Salar Jung?\", And there are many thousands who have never heard of his name. It was a revelation to millions, indeed, to hear that there were still Native States in India with Courts, Ministers, and Armies of their own. We fear that there are some, even among the educated classes, who would be puzzled to give a very definite account of the Deccan, or to describe the territories of the Nizam, and the nature and relations of the State and its ruler with the British Government. Had the Deccan been involved in the troubles of 1857-8, as Gwalior and Indore were, we should, no doubt, have been acquainted with the particulars, but the services which were rendered to the British Government at that eventful period were of the utmost value and magnitude, although they, fortunately, did not need to be written in characters of blood. The Deccan extends over nearly 100,000 square miles, and is peopled by 10,000,000 inhabitants, of whom the vast majority—probably nine in ten—are Hindoos. The soil is generally good and produces cotton in abundance. Coal and iron mines have been discovered, and the great rivers Kistna, Tombudra, and Godavery drain the vast plateau which forms the bulk of the land and open it to the Eastern and Western Oceans. The first Nizam established friendly relations with the English Governor of Fort St. David in 1747, which were generally maintained in the wars with the French and their allies, and, although for a time the ability and genius of Bussy secured the ascendancy of his councils and influence at Hyderabad, the troops and res const LABELS = { marker2: "Marker 2", "marker2-force": "Marker 2 force_ocr", haiku: "Haiku 5.5", luna: "GPT-6 Luna" };
const GROUPS = { "Les veilleurs": "Les Veilleurs", "Le Lion Vert": "Le Lion Vert", "Le Livre Noir": "Le Livre Noir",
  old_scans: "olmOCR · vieux scans", table_tests: "olmOCR · tableaux", multi_column: "olmOCR · multi-colonnes", long_tiny_text: "olmOCR · petits caractères" };
let mode = "diff";

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pct = v => v == null ? "—" : (v * 100).toFixed(1) + " %";
function grade(page, e) {
  const r = page.engines[e];
  if (page.set === "scans") return r.cer < 0.02 ? "good" : r.cer < 0.05 ? "mid" : "bad";
  const rate = r.tests ? r.passed / r.tests : 0;
  return rate >= 0.9 ? "good" : rate >= 0.7 ? "mid" : "bad";
}

function renderSummary() {
  const cats = ["old_scans", "table_tests", "multi_column", "long_tiny_text"];
  let h = "<thead><tr><th></th><th>CER scans</th><th>WER méd.</th><th>accents</th><th>mots ajoutés</th><th>blocs omis</th><th>olmOCR</th>"
    + cats.map(c => `<th>${esc(GROUPS[c].replace("olmOCR · ", ""))}</th>`).join("") + "<th>s/page méd.</th><th>échecs</th></tr></thead><tbody>";
  for (const e of DATA.engines) {
    const s = DATA.summary[e];
    h += `<tr><td><b>${LABELS[e]}</b></td><td>${pct(s.scans.cer_global)}</td><td>${pct(s.scans.wer_median)}</td>`
      + `<td>${s.scans.accent_edits}</td><td>${s.scans.inserted_words}</td><td>${s.scans.omitted_blocks}</td><td><b>${pct(s.olmocr.score)}</b></td>`
      + cats.map(c => `<td>${pct(s.olmocr.by_category[c])}</td>`).join("")
      + `<td>${s.seconds_median ?? "—"}</td><td>${s.failures}</td></tr>`;
  }
  document.getElementById("summary").innerHTML = h + "</tbody>";
}

function renderNav(current) {
  let h = "", group = null;
  for (const p of DATA.pages) {
    if (p.group !== group) { group = p.group; h += `<h2>${esc(GROUPS[group] || group)}</h2>`; }
    const label = p.set === "scans" ? p.id.replace(/^.*-0*/, "p. ") : p.id.replace(/^olmocr-[a-z_]+-/, "").slice(0, 22);
    const chips = DATA.engines.map(e => `<span class="chip" style="background:var(--${grade(p, e)})" title="${LABELS[e]}"></span>`).join("");
    h += `<a href="#${esc(p.id)}" class="${p.id === current ? "active" : ""}"><span>${esc(label)}</span><span class="chips">${chips}</span></a>`;
  }
  document.getElementById("nav").innerHTML = h;
  document.querySelector("nav a.active")?.scrollIntoView({ block: "nearest" });
}

function engineCard(p, e) {
  const r = p.engines[e];
  let metrics, body;
  if (p.set === "scans") {
    metrics = `CER ${pct(r.cer)} · WER ${pct(r.wer)} · accents ${r.accent_edits} · +${r.inserted_words}/−${r.deleted_words} mots · ${r.seconds ?? "—"} s`;
    body = mode === "diff" ? `<div class="text diff">${r.diff}</div>` : `<pre class="text">${esc(r.raw ?? "(aucune sortie)")}</pre>`;
  } else {
    metrics = `${r.passed}/${r.tests} tests réussis · ${r.seconds ?? "—"} s`;
    const tests = r.results.map(t => `<li class="${t.passed ? "ok" : "ko"}">${t.passed ? "✓" : "✗"} ${esc(t.type)}${t.passed ? "" : " : " + esc(t.explanation)}</li>`).join("");
    body = `<ul class="tests">${tests}</ul><pre class="text">${esc(r.raw ?? "(aucune sortie)")}</pre>`;
  }
  return `<div class="card"><h3><span>${LABELS[e]}</span><span class="chip" style="background:var(--${grade(p, e)})"></span></h3>`
    + `<div class="metrics">${metrics}${r.status && r.status !== "ok" ? ` · <span class="ko">${esc(r.status)}</span>` : ""}</div>${body}</div>`;
}

function renderPage(id) {
  const p = DATA.pages.find(x => x.id === id) || DATA.pages[0];
  renderNav(p.id);
  const toggle = p.set === "scans"
    ? `<button data-mode="diff" aria-pressed="${mode === "diff"}">Diff avec la référence</button><button data-mode="raw" aria-pressed="${mode === "raw"}">Texte brut</button>`
    : "";
  let ref = "";
  if (p.set === "scans") {
    ref = `<div class="card ref-card"><h3>Référence</h3>`
      + (p.furniture?.length ? `<div class="furniture">Exclu du score : ${p.furniture.map(esc).join(" · ")}</div>` : "")
      + `<pre class="text">${esc(p.reference)}</pre></div>`;
  }
  document.getElementById("main").innerHTML =
    `<div class="toolbar"><h2>${esc(p.id)}</h2>${toggle}<button data-step="-1">← Préc.</button><button data-step="1">Suiv. →</button>`
    + (p.set === "scans" ? `<span class="legend"><del style="background:var(--del-bg)">manquant / faux</del> <ins style="background:var(--ins-bg);text-decoration:none">ajouté</ins></span>` : "")
    + `</div><div class="grid" style="--n:${DATA.engines.length}"><div><div class="card image-card"><a href="${esc(p.full_image)}" target="_blank" rel="noopener"><img src="${esc(p.image)}" alt="Page ${esc(p.id)}"></a></div>${ref}</div>`
    + DATA.engines.map(e => engineCard(p, e)).join("") + "</div>";
}

function current() { return decodeURIComponent(location.hash.slice(1)) || DATA.pages[0].id; }
function step(n) {
  const i = DATA.pages.findIndex(p => p.id === current());
  location.hash = DATA.pages[(i + n + DATA.pages.length) % DATA.pages.length].id;
}
document.addEventListener("click", ev => {
  const b = ev.target.closest("button");
  if (!b) return;
  if (b.dataset.mode) { mode = b.dataset.mode; renderPage(current()); }
  if (b.dataset.step) step(Number(b.dataset.step));
});
document.addEventListener("keydown", ev => {
  if (ev.key === "ArrowRight") step(1);
  if (ev.key === "ArrowLeft") step(-1);
});
window.addEventListener("hashchange", () => renderPage(current()));
renderSummary();
renderPage(current());
</script>
